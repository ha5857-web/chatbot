은 21%)를 부담해요.","출생 기록과 성장 기록을 가져오시면 판단이 빨라져요."]],"rChk":["질환 자체는 급여 대상일 수 있지만, 대부분의 급여 기준이 키 3백분위 이하를 함께 요구해서 확인이 필요해요.",["골연령과 혈액검사로 성장 상태를 먼저 확인해요.","키가 기준에 맞지 않으면 급여가 어려울 수 있어요. 이 경우 \"급여 대상 아님\" 비용을 확인해 보세요.","원장님이 결과를 보고 최종 판단해요."]]},"p1":["사춘기 징후는 언제 시작됐나요?","여아는 가슴 멍울, 남아는 고환 크기 증가가 첫 신호예요.",["여아 만 8세 미만 · 남아 만 9세 미만","그 이후에 시작됐어요","잘 모르겠어요"]],"p2":["성조숙증 검사(GnRH 자극검사)를 받아 보셨나요?","결과를 듣고 진단받았다면 첫 번째를 골라 주세요.",["받았고 성조숙증 진단을 들었어요","아직 받지 않았어요","잘 모르겠어요"]],"pub":{"pTest":["먼저 검사가 필요해요","성조숙증은 사춘기 징후가 일찍 시작됐는지와 검사 결과를 함께 봐야 진단돼요. 급여 여부는 진단이 나온 뒤에 정해져요.",["첫 진료에서 골연령 X-ray와 호르몬 혈액검사를 해요.","필요하면 GnRH 자극검사로 사춘기가 실제로 시작됐는지 확인해요 (약 2시간).","징후가 처음 보인 시기와 부모님의 사춘기 시기를 메모해 오세요."]],"pOk":["급여 가능성이 있어요","사춘기 징후가 이른 나이에 시작됐고 진단도 받으셨다면 급여 기준에 해당할 가능성이 있어요. 검사 수치와 치료 시작 나이 등 세부 기준은 원장님이 확인해요.",["급여가 되면 1개월 주사 한 번에 본인부담이 3만원대예요 (만 6세 이상 기준).","급여가 아니면 같은 약도 약값 전액을 부담해 1회 약 10만원 안팎이에요.","3개월 제형은 한 번에 결제하는 금액이 3배라 미리 확인해 두세요."]],"pNo":["급여가 어려울 수 있어요","기준 나이 이후에 시작된 사춘기는 성조숙증 기준에 해당하지 않거나 급여가 되지 않을 수 있어요. 치료가 꼭 필요한지는 따로 살펴봐야 해요.",["약값을 전액 부담하면 1개월 제형은 1회 약 10만원 안팎이에요.","치료 필요성과 비용을 원장님과 먼저 상담해 보세요.","치료비 계산에서 정확한 범위를 확인해 보세요."]]}},"prep":{"lead":"미리 챙겨 오시면 진료가 훨씬 정확하고 빨라져요. 항목을 누르면 ✓ 표시가 돼요.","secs":["꼭 챙겨 오세요","있으면 큰 도움이 돼요","검사가 있는 날"],"items":[["건강보험증·신분증","접수와 보험 확인에 필요해요."],["출생 시 몸무게·키·재태주수","SGA 진단과 보험 신청에 꼭 필요해요. 아기수첩(예방접종 수첩)이나 출산하신 병원 기록에서 찾을 수 있어요."],["연도별 키·몸무게 기록","학교 건강검진 결과표, 아기수첩, 집에서 잰 기록 모두 좋아요. 성장 달력에 미리 적어 두셔도 돼요."],["부모님 두 분의 키","유전적 목표키 계산에 사용돼요. 어머니의 초경 시기와 부모님의 사춘기 시기도 알려 주세요."],["다른 병원 검사 결과","혈액검사나 골연령 X-ray 결과·CD가 있으면 같은 검사를 다시 하지 않아도 돼요."],["복용 중인 약·영양제","이름과 용량을 적거나 사진으로 찍어 오세요. 한약과 건강기능식품도 포함해 주세요."],["과거 병력·수술·입원 기록","진단명과 시기만 간단히 적어 와도 충분해요."],["사춘기 징후 메모","가슴 멍울, 체모, 몸 냄새 등 변화가 처음 보인 시기를 적어 오시면 판단에 큰 도움이 돼요."],["금식 안내 확인","자극검사처럼 금식이 필요한 검사가 있어요. 예약할 때 안내받은 시간을 지켜 주세요. 물은 마셔도 돼요."],["아이와 함께 보낼 준비","검사가 길어질 수 있어요. 좋아하는 책이나 장난감, 편한 옷을 챙겨 오세요."]],"prog":"{done} / {total} 준비했어요","note":"<b>출생 기록이 없으신가요?</b> 출산하신 병원에 문의하시거나 아기수첩(예방접종 수첩)을 확인해 보세요. 일부만 있어도 괜찮아요.","cost":"<b>첫 진료 비용이 궁금하신가요?</b> 검사 없이 진료만 하면 부담이 크지 않아요. 혈액검사와 X-ray를 함께 하면 보통 약 15만~25만원(약제 제외)이에요. 검사 구성은 아이마다 달라서 원장님이 필요한 것만 정해요. 자세한 항목은 [검사 안내]에서 확인하세요."},"test":{"tags":["급여","보험 미적용 (전액 부담)","상황에 따라 달라요"],"lbl":["무엇을 확인하나요","준비와 소요 시간","비용과 결과"],"note":"<b>검사 비용은 세 가지로 나뉘어요.</b> 급여(본인부담 30%, 만 6세 미만 21%), 전액본인(보험이 적용되지 않아 단가를 그대로 부담), 비급여(병원 자체 가격)예요. 어떤 검사를 할지는 원장님이 아이에게 필요한 것만 정해요.","items":[["기본 혈액검사","빈혈·간·신장·갑상선·혈당 확인","빈혈, 간·신장 기능, 콜레스테롤, 혈당, 갑상선 기능, 전해질을 한 번 채혈로 확인해요. 성장이 느리거나 체중이 고민일 때 숨은 원인을 찾는 기본 검사예요.","금식이 필요한지는 예약할 때 안내받으세요. 채혈은 1~2분이면 끝나요.","대부분 급여예요. 총 약 8만4천원 중 본인부담은 약 2만5천원이에요(만 6세 이상, 만 6세 미만은 더 적어요). 결과는 대부분 당일에 확인하고 바로 설명해 드려요. 다만 칼슘·인·마그네슘은 2~3일 걸려요."],["성장 지표 검사 (IGF-1·IGF-BP3)","성장호르몬 분비를 간접 확인","IGF-1과 IGF-BP3는 성장호르몬이 몸에서 일하는 정도를 보여줘요. 성장호르몬 결핍이 의심될 때와 치료 중 용량을 조절할 때 확인해요.","금식 없이 채혈 1회예요. 기본 혈액검사와 함께 한 번에 뽑아요.","보험이 적용되지 않아 전액 본인부담이에요. 두 항목 합계 약 4만7천원이에요. 결과는 당일 확인돼요."],["사춘기 호르몬 검사","사춘기가 시작됐는지 가늠","LH·FSH와 여아는 에스트라디올, 남아는 테스토스테론, DHEAS, 프로락틴을 확인해요. 성조숙증이 의심될 때 사춘기가 실제로 시작됐는지 가늠하는 검사예요.","금식 없이 채혈 1회예요.","대부분 급여예요. 총 약 5만7천~7만원 중 본인부담은 약 1만7천~2만1천원이에요(만 6세 이상). 검사한 날 결과를 확인하고 바로 설명해 드려요."],["영양 상태 검사","비타민D·철분·혈당 조절·미량원소","비타민D, 철분 저장량(페리틴), 혈당 조절(HbA1c), 아연·중금속 등 미량원소를 확인해요. 성장에 필요한 영양 상태를 살피는 선택 검사예요.","금식 없이 채혈 1회예요. 모든 아이에게 필요한 검사는 아니고, 원장님이 필요하다고 판단할 때만 해요.","보험이 적용되지 않아요. 항목별로 비타민D 2만원, 페리틴 약 1만1천원, HbA1c 약 9천원, 중금속·미량원소 약 3만5천원이에요. 비타민D·페리틴·HbA1c는 당일, 아연 등 중금속·미량원소는 2~3일 걸려요."],["골연령·성장검진 X-ray","왼손 X-ray · 5분","왼손 X-ray 한 장으로 뼈 나이(골연령)를 봐요. 실제 나이보다 뼈가 얼마나 자랐는지로 앞으로 자랄 키와 사춘기 진행을 가늠해요. 필요하면 팔꿈치도 함께 찍어요.","금식이 필요 없고 5분이면 끝나요. 방사선량은 흉부 X-ray의 약 20분의 1로 매우 적어요.","성장검진 X-ray(손 2만원 + 팔꿈치 1만원)는 비급여예요. 성장호르몬 급여 치료 중에는 급여로 청구되어 본인부담이 훨씬 적은 경우도 있어요. 결과는 당일 설명해 드려요."],["성장호르몬 자극검사","8시간 금식 · 2~3시간 소요","약물로 성장호르몬 분비를 유도한 뒤 여러 번 채혈해 실제로 얼마나 분비되는지 확인해요. 성장호르몬결핍증을 진단하는 데 꼭 필요한 검사예요.","전날 밤 12시부터 8시간 금식이 필요해요(물은 가능). 2~3시간 걸리니 오전 일정을 비워 두세요. 바늘은 한 번만 꽂고 그 관으로 채혈해서 여러 번 찌르지 않아요.","채혈 횟수가 많아 다른 검사보다 비용이 커요. 정확한 비용은 예약할 때 문의해 주세요. 결과는 당일 확인돼요. 아이가 좋아하는 책이나 장난감을 챙겨 오세요."],["GnRH 자극검사","성조숙증 확인 · 약 2시간","주사 후 시간별로 채혈해 LH·FSH가 얼마나 오르는지 봐요. 사춘기가 실제로 시작됐는지(중추성 성조숙증) 확인하는 검사예요.","주사 후 0~90분 사이 정해진 시점마다 채혈하고, 총 약 2시간 걸려요. 금식 여부는 예약할 때 안내받으세요. 주사관은 한 번만 꽂아요.","대부분 급여예요. 채혈 시점 수에 따라 본인부담이 약 2만~4만5천원 더해져요(만 6세 이상). 결과는 당일 확인하고 설명해 드려요."],["뇌 MRI","20~30분 · 움직이지 않아야 해요","시상하부와 뇌하수체 등 뇌 구조를 확인해요. 사춘기가 아주 일찍 시작됐거나 호르몬 이상이 의심되는 일부 아이에게만 필요해요.","20~30분 걸리고 그동안 움직이지 않아야 해요. 만 7세 미만은 가벼운 진정이 필요할 수 있어요.","MRI가 필요한지는 원장님이 판단해요. 필요한 경우 비용과 예약 방법을 안내해 드려요."]]},"faq":{"cats":["예약·방문","검사","치료·주사","비용·보험","서류·기타"],"ph":"궁금한 단어로 검색","none":"찾는 내용이 없어요. 아래 챗봇이나 전화로 문의해 주세요.","items":[["진료 시간과 휴진일이 궁금해요","월·화·수·금은 10:00–20:00(점심 14:00–15:00, 접수 마감 19:45), 토·일은 09:00–18:00(점심 13:00–14:00, 접수 마감 17:45)이에요. 목요일과 공휴일은 휴진이에요."],["예약을 변경하고 싶어요","전화(02-523-0111)로 연락 주세요. 부득이 못 오시는 경우 최소 하루 전에 알려주시면 감사하겠습니다."],["하루에 검사가 다 끝나나요?","초진 상담, 골연령 X-ray, 대부분의 혈액검사는 당일에 결과까지 확인할 수 있어요. 다만 자극검사는 금식과 2~3시간이 필요해서 별도로 예약해 드려요."],["초진 기록지를 꼭 작성해야 하나요?","필수는 아니지만 미리 작성하시면 대기 시간이 줄고, 작성하신 내용에 맞춰 진료 전 필수 영상 안내도 문자로 보내 드려요. 첫 화면의 [초진 기록지 미리 작성]에서 작성하세요."],["검사 결과는 언제 나오나요?","대부분의 검사는 당일에 결과를 확인하고 원장님이 바로 설명해 드려요. 칼슘·인·마그네슘·아연 같은 미량원소 검사만 2~3일 걸리고, 결과가 나오는 대로 안내해 드려요."],["검사 전에 금식해야 하나요?","성장호르몬 자극검사는 전날 밤 12시부터 8시간 금식이 필요해요(물은 가능). 다른 검사는 검사마다 달라서, 예약할 때 안내받은 대로 하시면 돼요."],["아이가 주사·채혈을 무서워해요","성장호르몬 주사 바늘은 0.23mm로 모기 침보다 가늘어서 거의 아프지 않아요. 자극검사도 바늘을 한 번만 꽂아요. 검사 전에 무엇을 할지 아이에게 미리 알려 주면 훨씬 편안해해요."],["성장호르몬은 매일 맞아야 하나요?","네, 주 6~7회 밤에 자기 전에 맞아요. 몸에서 호르몬이 자연스럽게 나오는 시간에 맞추기 위해서예요. 간호사가 주사 방법을 직접 알려 드려요."],["평생 맞아야 하나요?","아니에요. 성장판이 닫히면 종료해요. 여아는 골연령 14~15세, 남아는 15~16세가 기준이에요."],["주사를 깜빡했어요","다음 날 평소대로 맞고, 두 배로 맞지는 마세요. 자주 빠진다면 효과에 영향을 줄 수 있으니 진료 때 꼭 말씀해 주세요. 자세한 기준은 원장님 안내를 따라 주세요."],["약은 얼마 동안 처방받나요?","성장호르몬은 보통 4~12주분을 한 번에 처방해요. 아이마다 달라요. 성호르몬억제제는 1개월 또는 3개월 제형이 있어요. 보관법은 처방할 때 안내해 드려요."],["치료 중에는 얼마나 자주 오나요?","대개 1~3개월 간격으로 진료하고, 혈액검사와 골연령 검사는 필요한 시기에 해요. 아이의 성장 속도와 치료 반응에 따라 원장님이 정해 드려요."],["급여·본인부담·비급여는 뭐가 다른가요?","급여는 보험 기준에 해당해 약값의 30%(만 6세 미만은 21%)만 부담하는 경우예요. 기준에 해당하지 않으면 급여 약가 그대로 전액 부담하거나 병원 비급여 가격이 적용돼요. 같은 약도 금액 차이가 커서 치료 전에 꼭 확인하세요."],["야간·토요일·공휴일에는 더 드나요?","진찰료에 가산이 붙어 몇천 원 더 나올 수 있어요. 약값과 검사비는 같아요."],["의료비 공제를 받을 수 있나요?","연 소득의 3%를 초과하는 의료비는 세액공제 대상이 될 수 있어요. 만 6세 이하는 한도가 없고, 7세 이상은 연 700만원까지예요. 공제 대상 여부는 항목마다 다를 수 있으니 영수증을 보관하고 국세청에서 확인해 주세요."],["진단서·확인서를 받을 수 있나요?","일반진단서 1만원, 영문 진단서 2만원, 소견서(학교 제출용)·진료확인서·통원확인서 3천원, 진료기록 영상 CD 1만원이에요. 금액은 바뀔 수 있어요. 진료 때 말씀해 주세요."],["통역이 가능한가요?","네, 여러 언어로 안내해 드리고 있어요. 방문 전에 미리 알려주시면 준비해 두겠습니다."],["우리 아이 기록은 어떻게 관리하나요?","성장 달력에 키·몸무게, 주사 날짜·부위·용량을 기록할 수 있어요. 아이는 최대 4명까지 추가할 수 있고, 형제자매의 일정은 달력에 음영으로 표시돼요."]]},"tour":{"insQ0":["치료 종류","먼저 궁금한 치료를 고르세요. 이 안내에서는 성장호르몬으로 이어가요. 성조숙증 치료는 이 단계에서 선택할 수 있어요."],"insNext":["이어서 비용 확인","[치료비 계산해 보기]를 누르면 방금 결과에 맞춰 선택된 상태로 예상 금액을 보여드려요. 궁금한 점은 전화로도 문의하실 수 있어요."],"testRes":["준비·비용 확인","무엇을 보는지, 준비와 소요 시간, 비용(급여 여부)과 결과 시기가 나와요. 다른 검사를 눌러 비교해 볼 수도 있어요."]}},"en":{"ins":{"q0":"Which treatment are you curious about?","q0h":"Pick the closest one. You can change it any time.","tgh":"Growth hormone treatment","tghs":"When a child is shorter than peers","tpu":"Early puberty treatment (puberty blocker)","tpus":"When puberty started early","nextHd":"Next steps","gh":{"rTest":["There is no diagnosis yet, so we can't say whether it is covered. Coverage depends on both the diagnosis and the height criteria. Please don't worry. At the first visit we will guide you through the tests you need, step by step.",["At the first visit we usually do a bone age X-ray (left hand) and an IGF-1 blood test.","If needed, a growth hormone stimulation test or chromosome test follows.","Bring birth weight and length records and school check-up records."]],"rIss":["Idiopathic short stature is generally not covered by insurance. If treatment starts, you pay the full drug price, and since it often continues for years the cost can be significant. We recommend first calmly discussing whether treatment is really needed.",["Talk through the expected benefit and the cost with the doctor.","In the cost calculator, check the estimate for \"Not covered\".","Watching growth without treatment is also a valid choice."]],"rEarly":["85–90% of children born SGA catch up on their own before age 2. Coverage generally starts from age 4, so for now the key is steady observation.",["Measure height and weight every 3 months and record them in the Growth Calendar.","If your child has not caught up after age 2, please come in for a visit.","Gather birth records (gestational age, birth weight and length) in advance."]],"rOk":["The condition you chose is a covered one and height is at or below the 3rd percentile, so you may meet the main criteria. Actual coverage is decided after the test results.",["Extra tests such as a growth hormone stimulation test or chromosome test may be needed.","If covered, you pay 30% of the drug price (21% under age 6).","Bringing birth and growth records speeds up the assessment."]],"rChk":["The condition itself may be covered, but most criteria also require height at or below the 3rd percentile, so this needs checking.",["We first check growth status with bone age and blood tests.","If height does not meet the criteria, coverage may be difficult. In that case check the \"Not covered\" cost.","The doctor makes the final decision after seeing the results."]]},"p1":["When did the signs of puberty start?","The first signs are breast buds in girls and testicular enlargement in boys.",["Before age 8 (girls) or before age 9 (boys)","After that age","I'm not sure"]],"p2":["Has your child had the precocious puberty test (GnRH stimulation test)?","If you heard the result and a diagnosis, choose the first option.",["Yes, and I was told it is precocious puberty","Not yet","I'm not sure"]],"pub":{"pTest":["Tests come first","Precocious puberty is diagnosed from when the signs started together with test results. Coverage is decided after the diagnosis.",["At the first visit we do a bone age X-ray and hormone blood tests.","If needed, a GnRH stimulation test confirms whether puberty has really started (about 2 hours).","Note when the signs first appeared and when the parents went through puberty."]],"pOk":["Coverage is possible","If the signs started at an early age and a diagnosis was made, you may meet the coverage criteria. The doctor checks details such as test values and age at treatment start.",["If covered, one monthly injection costs about ₩30,000–40,000 out of pocket (age 6 and over).","If not covered, the same drug is paid in full, about ₩100,000 per injection.","The 3-month type is paid in one go at about 3 times the amount, so check in advance."]],"pNo":["Coverage may be difficult","Puberty that begins after the cut-off age may not meet the precocious puberty criteria or may not be covered. Whether treatment is truly needed has to be looked at separately.",["If you pay the full drug price, the 1-month type is about ₩100,000 per injection.","Discuss the need for treatment and the cost with the doctor first.","Check the exact range in the cost calculator."]]}},"prep":{"lead":"Bringing these makes the visit more accurate and faster. Tap an item to tick it off.","secs":["Please bring","Very helpful if you have","On test days"],"items":[["Health insurance card and ID","Needed for registration and insurance check."],["Birth weight, length and gestational age","Essential for an SGA diagnosis and insurance claims. Find them in the baby record book (vaccination book) or the hospital where your child was born."],["Yearly height and weight records","School check-up reports, the baby book, or home measurements all work. You can also enter them in the Growth Calendar beforehand."],["Both parents' heights","Used to calculate the genetic target height. Please also tell us the mother's age at first period and when the parents went through puberty."],["Results from other hospitals","If you have blood tests or bone age X-ray results/CDs, the same test does not need repeating."],["Medicines and supplements taken","Write down names and doses or take photos. Include herbal medicine and health supplements."],["Past illnesses, surgeries, hospital stays","A short note of the diagnosis and date is enough."],["Notes on signs of puberty","Note when changes such as breast buds, body hair or body odor first appeared. It helps the assessment a lot."],["Check fasting instructions","Some tests, such as stimulation tests, need fasting. Follow the time you were told when booking. Water is allowed."],["Prepare for time with your child","Tests can run long. Bring a favorite book or toy and comfortable clothes."]],"prog":"{done} / {total} ready","note":"<b>Don't have the birth records?</b> Ask the hospital where your child was born or check the baby record (vaccination) book. Partial information is fine too.","cost":"<b>Wondering about the first visit cost?</b> A consultation without tests is not a big expense. With blood tests and X-rays together it is usually about ₩150,000–250,000 (excluding medicine). The test set differs for each child, and the doctor chooses only what is needed. See details in [Test guide]."},"test":{"tags":["Covered","Not covered (paid in full)","Depends on the case"],"lbl":["What it checks","Preparation and time","Cost and results"],"note":"<b>Test costs fall into three kinds.</b> Covered (you pay 30%, or 21% under age 6), self-pay in full (not covered, so the listed price is paid as is), and non-covered (the clinic’s own price). The doctor chooses only the tests your child needs.","items":[["Basic blood test","Anemia, liver, kidney, thyroid, glucose","One blood draw checks anemia, liver and kidney function, cholesterol, glucose, thyroid function and electrolytes. It is the basic test for finding hidden causes of slow growth or weight concerns.","Ask when booking whether fasting is needed. The blood draw takes 1–2 minutes.","Mostly covered. Out of about ₩84,000 in total, you pay about ₩25,000 (age 6 and over; less under age 6). Most results are checked the same day and explained right away. Only calcium, phosphorus and magnesium take 2–3 days."],["Growth markers (IGF-1, IGF-BP3)","Indirect check of growth hormone activity","IGF-1 and IGF-BP3 show how actively growth hormone is working in the body. They are checked when growth hormone deficiency is suspected and when adjusting the dose during treatment.","No fasting. One blood draw, taken together with the basic blood test.","Not covered, so paid in full. The two items total about ₩47,000. Results are available the same day."],["Puberty hormone test","Gauges whether puberty has started","We check LH and FSH, plus estradiol for girls or testosterone for boys, DHEAS and prolactin. When early puberty is suspected, it gauges whether puberty has actually begun.","No fasting. One blood draw.","Mostly covered. Out of about ₩57,000–70,000 in total, you pay about ₩17,000–21,000 (age 6 and over). Results are checked the same day and explained right away."],["Nutrition tests","Vitamin D, iron, glucose control, trace elements","We check vitamin D, iron stores (ferritin), blood sugar control (HbA1c) and trace elements such as zinc and heavy metals. These optional tests look at the nutrition needed for growth.","No fasting. One blood draw. Not every child needs it; it is done only when the doctor judges it necessary.","Not covered. By item: vitamin D ₩20,000, ferritin about ₩11,000, HbA1c about ₩9,000, heavy metals and trace elements about ₩35,000. Vitamin D, ferritin and HbA1c are same-day; heavy metals and trace elements such as zinc take 2–3 days."],["Bone age and growth X-ray","Left-hand X-ray · 5 minutes","One left-hand X-ray shows bone age. How far the bones have matured compared with real age helps estimate remaining growth and puberty progress. The elbow may be added if needed.","No fasting, and it takes 5 minutes. The radiation dose is about 1/20 of a chest X-ray, which is very low.","The growth X-ray (hand ₩20,000 + elbow ₩10,000) is not covered. During covered growth hormone treatment it may be billed as covered, which costs much less. Results are explained the same day."],["Growth hormone stimulation test","8-hour fast · 2–3 hours","A drug triggers growth hormone release, then blood is drawn several times to see how much is really released. It is essential for diagnosing growth hormone deficiency.","Fast for 8 hours from midnight the night before (water is fine). It takes 2–3 hours, so keep the morning free. The needle goes in once and blood is drawn through it, so no repeated sticks.","Many blood draws make it cost more than other tests. Please ask about the exact cost when booking. Results are available the same day. Bring a favorite book or toy."],["GnRH stimulation test","Early puberty check · about 2 hours","After an injection, blood is drawn at set times to see how far LH and FSH rise. It checks whether puberty has really started (central precocious puberty).","Blood is drawn at set times between 0 and 90 minutes after the injection, about 2 hours in total. Ask about fasting when booking. The line goes in only once.","Mostly covered. Depending on the number of draws, about ₩20,000–45,000 is added to your share (age 6 and over). Results are checked and explained the same day."],["Brain MRI","20–30 minutes · must stay still","It looks at brain structures such as the hypothalamus and pituitary. It is needed only for some children whose puberty started very early or who may have a hormone problem.","It takes 20–30 minutes and your child must stay still. Under age 7, light sedation may be needed.","The doctor decides whether an MRI is needed. If so, we will explain the cost and how to book."]]},"faq":{"cats":["Appointments & visits","Tests","Treatment & injections","Costs & insurance","Documents & other"],"ph":"Search by keyword","none":"Nothing found. Please ask the chatbot below or call us.","items":[["What are your hours and closing days?","Mon/Tue/Wed/Fri 10:00–20:00 (lunch 14:00–15:00, last check-in 19:45); Sat/Sun 09:00–18:00 (lunch 13:00–14:00, last check-in 17:45). Closed on Thursdays and public holidays."],["I want to change my appointment","Please call 02-523-0111. If you cannot come, we would appreciate notice at least one day ahead."],["Can all tests be done in one day?","The first consultation, bone age X-ray and most blood tests can be completed with results the same day. Stimulation tests need fasting and 2–3 hours, so we book them separately."],["Do I have to fill in the intake form?","It is not required, but completing it in advance shortens waiting, and we text you a must-watch video guide matched to your answers. Use [Fill in your intake form] on the home screen."],["When do test results come?","Most tests are checked the same day and the doctor explains them right away. Only trace-element tests such as calcium, phosphorus, magnesium and zinc take 2–3 days, and we let you know as soon as they are ready."],["Do we need to fast before tests?","The growth hormone stimulation test needs 8 hours of fasting from midnight (water allowed). Other tests differ, so follow what you were told when booking."],["My child is afraid of needles and blood draws","The growth hormone needle is 0.23 mm, thinner than a mosquito’s, so it barely hurts. Stimulation tests also use only one needle stick. Telling your child beforehand what will happen helps them feel calmer."],["Is growth hormone given every day?","Yes, 6–7 times a week at bedtime, to match the time the body naturally releases the hormone. Our nurses teach you the injection method in person."],["Is it for life?","No. Treatment ends when the growth plates close. The guide is a bone age of 14–15 for girls and 15–16 for boys."],["I forgot an injection","Take it as usual the next day, and do not double the dose. If doses are missed often, it can affect results, so please tell us at your visit. Follow the doctor’s own instructions for details."],["How long is each prescription?","Growth hormone is usually prescribed for 4–12 weeks at a time, and it varies by child. The puberty blocker comes as a 1-month or 3-month type. We explain storage when prescribing."],["How often do we visit during treatment?","Usually every 1–3 months, with blood tests and bone age checks when needed. The doctor decides based on growth speed and response to treatment."],["What is the difference between covered, self-pay and non-covered?","Covered means you meet insurance criteria and pay only 30% of the drug price (21% under age 6). If you do not meet the criteria, you pay the insurance drug price in full or the clinic’s non-covered price applies. The amounts differ a lot even for the same drug, so check before starting."],["Is it more expensive at night, Saturdays and holidays?","A surcharge is added to the consultation fee, a few thousand won more. Drug and test prices are the same."],["Can I get a medical expense deduction?","Medical expenses above 3% of annual income may qualify for a tax credit. There is no limit for children age 6 and under, and up to ₩7 million a year for age 7 and over. Eligibility can differ by item, so keep your receipts and check with the National Tax Service."],["Can I get a medical certificate?","General certificate ₩10,000, English certificate ₩20,000, a note for school, visit confirmation or attendance certificate ₩3,000 each, medical record CD ₩10,000. Prices may change. Please ask at your visit."],["Is interpretation available?","Yes, we guide in several languages. Please tell us before your visit so we can prepare."],["How do I keep track of my child's records?","In the Growth Calendar you can record height, weight, and injection date, site and dose. You can add up to 4 children, and siblings’ schedules are shaded on the calendar."]]},"tour":{"insQ0":["Treatment type","First choose the treatment you are curious about. This guide continues with growth hormone. You can pick early puberty treatment at this step."],"insNext":["Next: check the cost","Tap [Check treatment cost] and the estimate opens with your result already selected. You can also call us with questions."],"testRes":["Preparation and cost","It shows what the test checks, preparation and time, cost (and coverage), and when results come. You can tap another test to compare."]}},"zh":{"ins":{"q0":"您想了解哪种治疗？","q0h":"请选择最接近的一项，随时可以更改。","tgh":"生长激素治疗","tghs":"孩子比同龄人矮时","tpu":"性早熟治疗（性激素抑制剂）","tpus":"青春期过早开始时","nextHd":"下一步","gh":{"rTest":["目前还没有诊断，所以无法判断是否适用医保。医保需要同时确认“诊断”和“身高标准”。请不要担心，首次就诊时我们会一步步为您说明需要做的检查。",["首次就诊通常会做骨龄（左手X光）和IGF-1抽血检查。","必要时会接着做生长激素刺激试验或染色体检查。","请带上出生时体重、身长记录和学校体检记录。"]],"rIss":["特发性矮小一般不属于医保范围。开始治疗后需全额自付药费，通常会持续数年，费用负担可能较大。建议先和医生一起慢慢评估是否真的需要治疗。",["请与医生充分沟通治疗的预期效果和费用。","在费用计算中，先用“不适用医保”查看预计金额。","不治疗、先观察生长速度也是一种选择。"]],"rEarly":["出生时偏小（SGA）的孩子中，85～90%会在2岁前自行追上。医保一般从4岁起适用，所以现在最重要的是持续观察。",["每3个月测量身高体重，并记录在成长日历中。","如果2岁后仍未追上同龄人，请来就诊。","请提前准备出生记录（孕周、出生体重和身长）。"]],"rOk":["您选择的疾病属于医保范围，且身高在第3百分位以下，可能符合主要标准。不过实际是否适用，要看检查结果。",["可能还需要生长激素刺激试验或染色体检查等追加检查。","适用医保时，自付药费的30%（不满6周岁为21%）。","带上出生记录和生长记录，判断会更快。"]],"rChk":["疾病本身可能属于医保范围，但大多数标准还要求身高在第3百分位以下，所以需要确认。",["先通过骨龄和抽血检查确认生长状态。","如果身高不符合标准，可能难以适用医保。这时请查看“不适用医保”的费用。","医生会根据结果做出最终判断。"]]},"p1":["青春期迹象是什么时候开始的？","女孩的第一个信号是乳房硬块，男孩是睾丸增大。",["女孩不满8周岁、男孩不满9周岁时开始","在此之后开始","不确定"]],"p2":["做过性早熟检查（GnRH刺激试验）吗？","如果已听过结果并被诊断，请选第一项。",["做过，并被告知是性早熟","还没做","不确定"]],"pub":{"pTest":["需要先做检查","性早熟需要同时看青春期迹象开始的时间和检查结果才能诊断。是否适用医保要在诊断之后决定。",["首次就诊会做骨龄X光和激素抽血检查。","必要时用GnRH刺激试验确认青春期是否真的开始（约2小时）。","请记下迹象最初出现的时间和父母进入青春期的时间。"]],"pOk":["有可能适用医保","如果青春期迹象在较早年龄开始并已确诊，可能符合医保标准。检查数值和开始治疗的年龄等细则由医生确认。",["适用医保时，1个月剂型每次自付约3万多韩元（满6周岁以上）。","不适用医保时，同样的药需全额自付，每次约10万韩元左右。","3个月剂型一次要付约3倍的金额，请提前确认。"]],"pNo":["可能难以适用医保","超过标准年龄才开始的青春期，可能不符合性早熟标准，或不能适用医保。是否真的需要治疗要另外评估。",["如果全额自付药费，1个月剂型每次约10万韩元左右。","请先与医生沟通治疗的必要性和费用。","请在费用计算中查看准确的范围。"]]}},"prep":{"lead":"提前准备好，就诊会更准确也更快。点击条目即可打勾。","secs":["请务必带上","有的话很有帮助","做检查的日子"],"items":[["医保卡·身份证件","办理挂号和确认医保时需要。"],["出生时体重·身长·孕周","诊断SGA和办理医保时必需。可在婴儿手册（疫苗接种手册）或出生医院的记录中找到。"],["历年身高·体重记录","学校体检表、婴儿手册、在家测量的记录都可以。也可以先记在成长日历里。"],["父母双方的身高","用于计算遗传目标身高。也请告诉我们母亲初潮的年龄和父母进入青春期的时间。"],["其他医院的检查结果","如果有抽血或骨龄X光的结果、光盘，就不必重复同样的检查。"],["正在服用的药物·营养品","请写下名称和剂量，或拍照带来。中药和保健品也请一并列出。"],["既往病史·手术·住院记录","简单写下诊断名称和时间即可。"],["青春期迹象记录","请记下乳房硬块、体毛、体味等变化最初出现的时间，对判断很有帮助。"],["确认禁食说明","像刺激试验这样的检查需要禁食。请遵守预约时告知的时间。可以喝水。"],["和孩子一起度过的准备","检查可能耗时较长。请带上孩子喜欢的书或玩具，穿舒适的衣服。"]],"prog":"已准备 {done} / {total}","note":"<b>没有出生记录吗？</b>请向出生医院咨询，或查看婴儿手册（疫苗接种手册）。只有一部分也没关系。","cost":"<b>想知道首次就诊的费用吗？</b>只看诊不做检查，负担不大。同时做抽血和X光，通常约15万～25万韩元（不含药费）。检查项目因孩子而异，医生只会安排必要的项目。详情请见[检查说明]。"},"test":{"tags":["医保","不适用医保（全额自付）","视情况而定"],"lbl":["检查什么","准备与所需时间","费用与结果"],"note":"<b>检查费用分三种。</b>医保（自付30%，不满6周岁为21%）、全额自付（不适用医保，按原价支付）、自费（医院自定价格）。医生只会安排孩子需要的检查。","items":[["基础抽血检查","贫血·肝·肾·甲状腺·血糖","一次抽血即可检查贫血、肝肾功能、胆固醇、血糖、甲状腺功能和电解质。是在生长缓慢或体重有烦恼时寻找隐藏原因的基础检查。","是否需要禁食，请在预约时确认。抽血1～2分钟就结束。","大多适用医保。总额约8.4万韩元中自付约2.5万韩元（满6周岁以上，不满6周岁更少）。大多数结果当天即可确认并立即说明。只有钙、磷、镁需要2～3天。"],["生长指标检查（IGF-1·IGF-BP3）","间接了解生长激素活性","IGF-1和IGF-BP3反映生长激素在体内的作用程度。怀疑生长激素缺乏时，以及治疗中调整剂量时会检查。","无需禁食，抽血一次。与基础抽血检查一并抽取。","不适用医保，需全额自付。两项合计约4.7万韩元。结果当天即可确认。"],["青春期激素检查","判断青春期是否开始","检查LH、FSH，女孩加查雌二醇，男孩加查睾酮，以及DHEAS和催乳素。怀疑性早熟时，用来判断青春期是否真的开始。","无需禁食，抽血一次。","大多适用医保。总额约5.7万～7万韩元中自付约1.7万～2.1万韩元（满6周岁以上）。检查当天确认结果并立即说明。"],["营养状态检查","维生素D·铁·血糖控制·微量元素","检查维生素D、铁储备（铁蛋白）、血糖控制（HbA1c）以及锌、重金属等微量元素。是了解生长所需营养状态的选择性检查。","无需禁食，抽血一次。并非每个孩子都需要，只有医生认为必要时才做。","不适用医保。各项目：维生素D 2万韩元，铁蛋白约1.1万韩元，HbA1c约9千韩元，重金属·微量元素约3.5万韩元。维生素D、铁蛋白、HbA1c当天出结果，锌等重金属·微量元素需2～3天。"],["骨龄·生长检查X光","左手X光 · 5分钟","一张左手X光即可看骨龄。通过骨骼比实际年龄成熟了多少，来推测今后的身高增长和青春期进展。必要时也会拍肘部。","无需禁食，5分钟即可完成。辐射量约为胸部X光的1/20，非常少。","生长检查X光（手2万韩元＋肘1万韩元）为自费。在适用医保的生长激素治疗期间，也可能按医保收费，自付会少很多。结果当天说明。"],["生长激素刺激试验","禁食8小时 · 需2～3小时","用药物诱发生长激素分泌，然后多次抽血，确认实际分泌了多少。是诊断生长激素缺乏症必不可少的检查。","前一晚12点起需禁食8小时（可以喝水）。需要2～3小时，请空出上午的时间。针只扎一次，通过留置管抽血，不会反复穿刺。","因为抽血次数多，费用比其他检查高。准确费用请在预约时咨询。结果当天即可确认。请带上孩子喜欢的书或玩具。"],["GnRH刺激试验","确认性早熟 · 约2小时","注射后按时间点抽血，看LH、FSH升高多少。用来确认青春期是否真的开始（中枢性性早熟）。","注射后0～90分钟内按规定时间点抽血，总共约2小时。是否禁食请在预约时确认。留置管只扎一次。","大多适用医保。视抽血时间点数量，自付额增加约2万～4.5万韩元（满6周岁以上）。结果当天确认并说明。"],["脑部MRI","20～30分钟 · 需保持不动","检查下丘脑、垂体等脑部结构。只有青春期开始得非常早或怀疑激素异常的部分孩子才需要。","需要20～30分钟，期间必须保持不动。不满7周岁可能需要轻度镇静。","是否需要MRI由医生判断。需要时我们会说明费用和预约方法。"]]},"faq":{"cats":["预约·就诊","检查","治疗·注射","费用·医保","证明·其他"],"ph":"输入关键词搜索","none":"没有找到相关内容。请向下方的聊天机器人咨询或来电。","items":[["诊疗时间和休息日是怎样的？","周一、二、三、五 10:00–20:00（午休 14:00–15:00，挂号截止 19:45），周六、日 09:00–18:00（午休 13:00–14:00，挂号截止 17:45）。周四和公休日休诊。"],["我想更改预约","请致电02-523-0111。如无法前来，请至少提前一天告知，谢谢。"],["检查一天能做完吗？","初诊咨询、骨龄X光和大多数抽血检查当天即可完成并确认结果。但刺激试验需要禁食和2～3小时，所以另行预约。"],["一定要填写初诊登记表吗？","不是必须，但提前填写可缩短等候时间，我们还会根据您填写的内容，通过短信发送就诊前的必看视频指南。请在首页的[初诊登记表]中填写。"],["检查结果什么时候出来？","大多数检查当天即可确认结果，医生会立即说明。只有钙、磷、镁、锌等微量元素检查需要2～3天，出结果后会及时通知您。"],["检查前需要禁食吗？","生长激素刺激试验需要从前一晚12点起禁食8小时（可以喝水）。其他检查各不相同，请按预约时告知的要求做。"],["孩子害怕打针和抽血","生长激素的针头只有0.23mm，比蚊子的针还细，几乎不疼。刺激试验也只扎一次针。检查前先告诉孩子要做什么，孩子会安心得多。"],["生长激素需要每天打吗？","是的，每周6～7次，在睡前注射，目的是配合身体自然分泌激素的时间。护士会亲自教您注射方法。"],["要打一辈子吗？","不是。生长板闭合后即结束。标准是女孩骨龄14～15岁，男孩15～16岁。"],["我忘记打针了","第二天照常注射，不要加倍。如果经常漏打可能影响效果，就诊时请告诉我们。具体标准请遵循医生的指导。"],["一次开多长时间的药？","生长激素通常一次开4～12周的量，因孩子而异。性激素抑制剂有1个月和3个月两种剂型。保存方法在开药时会说明。"],["治疗期间多久来一次？","通常每1～3个月就诊一次，抽血和骨龄检查在需要时进行。医生会根据孩子的生长速度和治疗反应来决定。"],["医保、全额自付、自费有什么区别？","医保是指符合保险标准，只需自付药费的30%（不满6周岁为21%）。不符合标准时，需按医保药价全额自付，或适用医院的自费价格。即使同一种药金额差别也很大，请在治疗前确认。"],["夜间、周六、公休日会更贵吗？","诊察费会有加价，可能多几千韩元。药费和检查费相同。"],["可以申请医疗费扣除吗？","超过年收入3%的医疗费可能可以申请税额扣除。6周岁以下无上限，7周岁以上每年最高700万韩元。是否可扣除因项目而异，请保管好收据并向国税厅确认。"],["可以开具诊断书、证明吗？","普通诊断书1万韩元，英文诊断书2万韩元，意见书（学校提交用）、就诊确认书、门诊证明各3千韩元，病历影像光盘1万韩元。金额可能变动。请就诊时告知。"],["可以提供翻译吗？","可以，我们提供多种语言的说明。请在就诊前告知，我们会提前准备。"],["如何管理孩子的记录？","在成长日历中可以记录身高、体重，以及注射日期、部位和剂量。最多可添加4个孩子，兄弟姐妹的日程会在日历上以阴影显示。"]]},"tour":{"insQ0":["治疗类型","请先选择您想了解的治疗。本指南接下来以生长激素为例。性早熟治疗可在这一步选择。"],"insNext":["接着看费用","点击[查看治疗费用]，会按刚才的结果自动选好并显示预计金额。有疑问也可以来电咨询。"],"testRes":["准备与费用","这里会显示检查内容、准备与所需时间、费用（是否适用医保）以及出结果的时间。也可以点其他检查进行比较。"]}},"zh-TW":{"ins":{"q0":"您想了解哪種治療？","q0h":"請選擇最接近的一項，隨時可以更改。","tgh":"生長激素治療","tghs":"孩子比同齡人矮時","tpu":"性早熟治療（性荷爾蒙抑制劑）","tpus":"青春期過早開始時","nextHd":"下一步","gh":{"rTest":["目前還沒有診斷，所以無法判斷是否適用健保。健保需要同時確認「診斷」與「身高標準」。請不要擔心，首次就診時我們會一步步為您說明需要做的檢查。",["首次就診通常會做骨齡（左手X光）與IGF-1抽血檢查。","必要時會接著做生長激素刺激試驗或染色體檢查。","請帶上出生時體重、身長記錄與學校體檢記錄。"]],"rIss":["特發性矮小一般不屬於健保範圍。開始治療後需全額自付藥費，通常會持續數年，費用負擔可能較大。建議先和醫師一起慢慢評估是否真的需要治療。",["請與醫師充分溝通治療的預期效果與費用。","在費用計算中，先用「不適用健保」查看預估金額。","不治療、先觀察生長速度也是一種選擇。"]],"rEarly":["出生時偏小（SGA）的孩子中，85～90%會在2歲前自行追上。健保一般從4歲起適用，所以現在最重要的是持續觀察。",["每3個月測量身高體重，並記錄在成長日曆中。","如果2歲後仍未追上同齡人，請來就診。","請提前準備出生記錄（孕週、出生體重與身長）。"]],"rOk":["您選擇的疾病屬於健保範圍，且身高在第3百分位以下，可能符合主要標準。不過實際是否適用，要看檢查結果。",["可能還需要生長激素刺激試驗或染色體檢查等追加檢查。","適用健保時，自付藥費的30%（未滿6歲為21%）。","帶上出生記錄與生長記錄，判斷會更快。"]],"rChk":["疾病本身可能屬於健保範圍，但大多數標準還要求身高在第3百分位以下，所以需要確認。",["先透過骨齡與抽血檢查確認生長狀態。","如果身高不符合標準，可能難以適用健保。這時請查看「不適用健保」的費用。","醫師會根據結果做出最終判斷。"]]},"p1":["青春期跡象是什麼時候開始的？","女孩的第一個訊號是乳房硬塊，男孩是睪丸增大。",["女孩未滿8歲、男孩未滿9歲時開始","在此之後開始","不確定"]],"p2":["做過性早熟檢查（GnRH刺激試驗）嗎？","如果已聽過結果並被診斷，請選第一項。",["做過，並被告知是性早熟","還沒做","不確定"]],"pub":{"pTest":["需要先做檢查","性早熟需要同時看青春期跡象開始的時間與檢查結果才能診斷。是否適用健保要在診斷之後決定。",["首次就診會做骨齡X光與荷爾蒙抽血檢查。","必要時用GnRH刺激試驗確認青春期是否真的開始（約2小時）。","請記下跡象最初出現的時間與父母進入青春期的時間。"]],"pOk":["有可能適用健保","如果青春期跡象在較早年齡開始並已確診，可能符合健保標準。檢查數值與開始治療的年齡等細則由醫師確認。",["適用健保時，1個月劑型每次自付約3萬多韓元（滿6歲以上）。","不適用健保時，同樣的藥需全額自付，每次約10萬韓元左右。","3個月劑型一次要付約3倍的金額，請提前確認。"]],"pNo":["可能難以適用健保","超過標準年齡才開始的青春期，可能不符合性早熟標準，或不能適用健保。是否真的需要治療要另外評估。",["如果全額自付藥費，1個月劑型每次約10萬韓元左右。","請先與醫師溝通治療的必要性與費用。","請在費用計算中查看準確的範圍。"]]}},"prep":{"lead":"提前準備好，就診會更準確也更快。點選項目即可打勾。","secs":["請務必帶上","有的話很有幫助","做檢查的日子"],"items":[["健保卡·身分證件","辦理掛號與確認健保時需要。"],["出生時體重·身長·孕週","診斷SGA與辦理健保時必需。可在嬰兒手冊（疫苗接種手冊）或出生醫院的記錄中找到。"],["歷年身高·體重記錄","學校體檢表、嬰兒手冊、在家測量的記錄都可以。也可以先記在成長日曆裡。"],["父母雙方的身高","用於計算遺傳目標身高。也請告訴我們母親初經的年齡與父母進入青春期的時間。"],["其他醫院的檢查結果","如果有抽血或骨齡X光的結果、光碟，就不必重複同樣的檢查。"],["正在服用的藥物·營養品","請寫下名稱與劑量，或拍照帶來。中藥與保健食品也請一併列出。"],["過去病史·手術·住院記錄","簡單寫下診斷名稱與時間即可。"],["青春期跡象記錄","請記下乳房硬塊、體毛、體味等變化最初出現的時間，對判斷很有幫助。"],["確認禁食說明","像刺激試驗這樣的檢查需要禁食。請遵守預約時告知的時間。可以喝水。"],["與孩子一起度過的準備","檢查可能耗時較長。請帶上孩子喜歡的書或玩具，穿舒適的衣服。"]],"prog":"已準備 {done} / {total}","note":"<b>沒有出生記錄嗎？</b>請向出生醫院詢問，或查看嬰兒手冊（疫苗接種手冊）。只有一部分也沒關係。","cost":"<b>想知道首次就診的費用嗎？</b>只看診不做檢查，負擔不大。同時做抽血與X光，通常約15萬～25萬韓元（不含藥費）。檢查項目因孩子而異，醫師只會安排必要的項目。詳情請見[檢查說明]。"},"test":{"tags":["健保","不適用健保（全額自付）","視情況而定"],"lbl":["檢查什麼","準備與所需時間","費用與結果"],"note":"<b>檢查費用分三種。</b>健保（自付30%，未滿6歲為21%）、全額自付（不適用健保，按原價支付）、自費（醫院自定價格）。醫師只會安排孩子需要的檢查。","items":[["基礎抽血檢查","貧血·肝·腎·甲狀腺·血糖","一次抽血即可檢查貧血、肝腎功能、膽固醇、血糖、甲狀腺功能與電解質。是在生長緩慢或體重有煩惱時尋找隱藏原因的基礎檢查。","是否需要禁食，請在預約時確認。抽血1～2分鐘就結束。","大多適用健保。總額約8.4萬韓元中自付約2.5萬韓元（滿6歲以上，未滿6歲更少）。大多數結果當天即可確認並立即說明。只有鈣、磷、鎂需要2～3天。"],["生長指標檢查（IGF-1·IGF-BP3）","間接了解生長激素活性","IGF-1與IGF-BP3反映生長激素在體內的作用程度。懷疑生長激素缺乏時，以及治療中調整劑量時會檢查。","無需禁食，抽血一次。與基礎抽血檢查一併抽取。","不適用健保，需全額自付。兩項合計約4.7萬韓元。結果當天即可確認。"],["青春期荷爾蒙檢查","判斷青春期是否開始","檢查LH、FSH，女孩加查雌二醇，男孩加查睪固酮，以及DHEAS與泌乳素。懷疑性早熟時，用來判斷青春期是否真的開始。","無需禁食，抽血一次。","大多適用健保。總額約5.7萬～7萬韓元中自付約1.7萬～2.1萬韓元（滿6歲以上）。檢查當天確認結果並立即說明。"],["營養狀態檢查","維生素D·鐵·血糖控制·微量元素","檢查維生素D、鐵儲備（鐵蛋白）、血糖控制（HbA1c）以及鋅、重金屬等微量元素。是了解生長所需營養狀態的選擇性檢查。","無需禁食，抽血一次。並非每個孩子都需要，只有醫師認為必要時才做。","不適用健保。各項目：維生素D 2萬韓元，鐵蛋白約1.1萬韓元，HbA1c約9千韓元，重金屬·微量元素約3.5萬韓元。維生素D、鐵蛋白、HbA1c當天出結果，鋅等重金屬·微量元素需2～3天。"],["骨齡·生長檢查X光","左手X光 · 5分鐘","一張左手X光即可看骨齡。透過骨骼比實際年齡成熟了多少，來推測今後的身高增長與青春期進展。必要時也會拍手肘。","無需禁食，5分鐘即可完成。輻射量約為胸部X光的1/20，非常少。","生長檢查X光（手2萬韓元＋手肘1萬韓元）為自費。在適用健保的生長激素治療期間，也可能按健保收費，自付會少很多。結果當天說明。"],["生長激素刺激試驗","禁食8小時 · 需2～3小時","用藥物誘發生長激素分泌，然後多次抽血，確認實際分泌了多少。是診斷生長激素缺乏症必不可少的檢查。","前一晚12點起需禁食8小時（可以喝水）。需要2～3小時，請空出上午的時間。針只扎一次，透過留置管抽血，不會反覆穿刺。","因為抽血次數多，費用比其他檢查高。準確費用請在預約時詢問。結果當天即可確認。請帶上孩子喜歡的書或玩具。"],["GnRH刺激試驗","確認性早熟 · 約2小時","注射後依時間點抽血，看LH、FSH升高多少。用來確認青春期是否真的開始（中樞性性早熟）。","注射後0～90分鐘內依規定時間點抽血，總共約2小時。是否禁食請在預約時確認。留置管只扎一次。","大多適用健保。視抽血時間點數量，自付額增加約2萬～4.5萬韓元（滿6歲以上）。結果當天確認並說明。"],["腦部MRI","20～30分鐘 · 需保持不動","檢查下視丘、腦下垂體等腦部結構。只有青春期開始得非常早或懷疑荷爾蒙異常的部分孩子才需要。","需要20～30分鐘，期間必須保持不動。未滿7歲可能需要輕度鎮靜。","是否需要MRI由醫師判斷。需要時我們會說明費用與預約方法。"]]},"faq":{"cats":["預約·就診","檢查","治療·注射","費用·健保","證明·其他"],"ph":"輸入關鍵字搜尋","none":"沒有找到相關內容。請向下方的聊天機器人詢問或來電。","items":[["診療時間與休診日是怎樣的？","週一、二、三、五 10:00–20:00（午休 14:00–15:00，掛號截止 19:45），週六、日 09:00–18:00（午休 13:00–14:00，掛號截止 17:45）。週四與公休日休診。"],["我想更改預約","請致電02-523-0111。如無法前來，請至少提前一天告知，謝謝。"],["檢查一天能做完嗎？","初診諮詢、骨齡X光與大多數抽血檢查當天即可完成並確認結果。但刺激試驗需要禁食與2～3小時，所以另行預約。"],["一定要填寫初診登記表嗎？","不是必須，但提前填寫可縮短等候時間，我們還會依您填寫的內容，以簡訊傳送就診前的必看影片指南。請在首頁的[初診登記表]中填寫。"],["檢查結果什麼時候出來？","大多數檢查當天即可確認結果，醫師會立即說明。只有鈣、磷、鎂、鋅等微量元素檢查需要2～3天，出結果後會及時通知您。"],["檢查前需要禁食嗎？","生長激素刺激試驗需要從前一晚12點起禁食8小時（可以喝水）。其他檢查各不相同，請依預約時告知的要求做。"],["孩子害怕打針與抽血","生長激素的針頭只有0.23mm，比蚊子的針還細，幾乎不痛。刺激試驗也只扎一次針。檢查前先告訴孩子要做什麼，孩子會安心得多。"],["生長激素需要每天打嗎？","是的，每週6～7次，在睡前注射，目的是配合身體自然分泌荷爾蒙的時間。護理師會親自教您注射方法。"],["要打一輩子嗎？","不是。生長板閉合後即結束。標準是女孩骨齡14～15歲，男孩15～16歲。"],["我忘記打針了","隔天照常注射，不要加倍。如果經常漏打可能影響效果，就診時請告訴我們。具體標準請遵循醫師的指導。"],["一次開多長時間的藥？","生長激素通常一次開4～12週的量，因孩子而異。性荷爾蒙抑制劑有1個月與3個月兩種劑型。保存方法在開藥時會說明。"],["治療期間多久來一次？","通常每1～3個月就診一次，抽血與骨齡檢查在需要時進行。醫師會依孩子的生長速度與治療反應來決定。"],["健保、全額自付、自費有什麼差別？","健保是指符合保險標準，只需自付藥費的30%（未滿6歲為21%）。不符合標準時，需按健保藥價全額自付，或適用醫院的自費價格。即使同一種藥金額差別也很大，請在治療前確認。"],["夜間、週六、公休日會更貴嗎？","診察費會有加成，可能多幾千韓元。藥費與檢查費相同。"],["可以申請醫療費扣除嗎？","超過年收入3%的醫療費可能可以申請稅額扣除。6歲以下無上限，7歲以上每年最高700萬韓元。是否可扣除因項目而異，請保管好收據並向國稅廳確認。"],["可以開立診斷書、證明嗎？","一般診斷書1萬韓元，英文診斷書2萬韓元，意見書（學校提交用）、就診確認書、門診證明各3千韓元，病歷影像光碟1萬韓元。金額可能變動。請就診時告知。"],["可以提供翻譯嗎？","可以，我們提供多種語言的說明。請在就診前告知，我們會提前準備。"],["如何管理孩子的記錄？","在成長日曆中可以記錄身高、體重，以及注射日期、部位與劑量。最多可新增4個孩子，兄弟姊妹的行程會在日曆上以陰影顯示。"]]},"tour":{"insQ0":["治療類型","請先選擇您想了解的治療。本指南接下來以生長激素為例。性早熟治療可在這一步選擇。"],"insNext":["接著看費用","點選[查看治療費用]，會依剛才的結果自動選好並顯示預估金額。有疑問也可以來電諮詢。"],"testRes":["準備與費用","這裡會顯示檢查內容、準備與所需時間、費用（是否適用健保）以及出結果的時間。也可以點其他檢查進行比較。"]}},"ja":{"ins":{"q0":"どの治療が気になりますか？","q0h":"近いものを選んでください。いつでも変更できます。","tgh":"成長ホルモン治療","tghs":"身長が同年代より低いとき","tpu":"思春期早発症の治療（性ホルモン抑制剤）","tpus":"思春期が早く始まったとき","nextHd":"次のステップ","gh":{"rTest":["まだ診断前のため、保険適用かどうかはお伝えできません。保険適用は「診断」と「身長の基準」をあわせて確認して決まります。ご心配なく。初診で必要な検査から順にご案内します。",["初診では通常、骨年齢（左手X線）とIGF-1の血液検査を行います。","必要に応じて、成長ホルモン負荷試験や染色体検査に進みます。","出生時の体重・身長の記録と、学校の健康診断の記録をお持ちください。"]],"rIss":["特発性低身長は、一般的に保険適用外です。治療を始めると薬代は全額自己負担になり、数年続くことが多いため費用の負担が大きくなる場合があります。まず治療が本当に必要かどうかを、ゆっくり一緒に考えることをおすすめします。",["期待できる効果と費用について、院長とじっくり相談してみてください。","治療費の計算で「保険適用外」の場合の目安金額を事前に確認してみてください。","治療せずに成長の様子を見守ることも一つの選択です。"]],"rEarly":["SGAで生まれたお子さまの85～90%は、2歳までに自然に追いつきます。保険適用は一般的に4歳からなので、今は継続して見守る時期です。",["3か月ごとに身長・体重を測って、成長カレンダーに記録しましょう。","2歳を過ぎても追いつかない場合は、受診してください。","出生記録（在胎週数・出生体重・身長）を事前に準備しておきましょう。"]],"rOk":["選ばれた疾患は保険適用の対象で、身長も第3パーセンタイル以下のため、主な基準に該当する可能性があります。ただし実際の適用は、検査結果を確認して決まります。",["成長ホルモン負荷試験や染色体検査などの追加検査が必要な場合があります。","保険適用になれば、薬代の30%（6歳未満は21%）を負担します。","出生記録と成長記録をお持ちいただくと、判断が早くなります。"]],"rChk":["疾患自体は保険適用の対象となる場合がありますが、ほとんどの基準が身長第3パーセンタイル以下も求めるため、確認が必要です。",["まず骨年齢と血液検査で成長の状態を確認します。","身長が基準に合わない場合、保険適用は難しいことがあります。その場合は「保険適用外」の費用をご確認ください。","最終的な判断は、結果を見て院長が行います。"]]},"p1":["思春期の兆候はいつ始まりましたか？","女児は乳房のしこり、男児は精巣の大きさの増加が最初のサインです。",["女児8歳未満・男児9歳未満で始まった","それ以降に始まった","わからない"]],"p2":["思春期早発症の検査（GnRH負荷試験）を受けましたか？","結果を聞いて診断された場合は、1つ目を選んでください。",["受けて、思春期早発症と言われた","まだ受けていない","わからない"]],"pub":{"pTest":["まず検査が必要です","思春期早発症は、思春期の兆候が早く始まったかどうかと検査結果をあわせて診断します。保険適用は診断が出たあとに決まります。",["初診では骨年齢のX線とホルモンの血液検査を行います。","必要に応じてGnRH負荷試験で、思春期が実際に始まっているか確認します（約2時間）。","兆候に最初に気づいた時期と、ご両親の思春期の時期をメモしてお持ちください。"]],"pOk":["保険適用の可能性があります","思春期の兆候が早い年齢で始まり、診断も受けている場合、保険適用の基準に該当する可能性があります。検査数値や治療開始年齢などの詳細な基準は、院長が確認します。",["保険適用なら、1か月製剤の注射1回あたりの自己負担は3万ウォン台です（6歳以上の場合）。","保険適用外だと、同じ薬でも薬代を全額負担し、1回あたり約10万ウォン前後です。","3か月製剤は1回の支払いが約3倍になるので、事前にご確認ください。"]],"pNo":["保険適用が難しいかもしれません","基準年齢のあとに始まった思春期は、思春期早発症の基準に該当しない、または保険適用にならない場合があります。治療が本当に必要かどうかは別に検討する必要があります。",["薬代を全額負担する場合、1か月製剤は1回あたり約10万ウォン前後です。","治療の必要性と費用を、まず院長と相談してみてください。","治療費の計算で、正確な範囲をご確認ください。"]]}},"prep":{"lead":"事前にご準備いただくと、診察がより正確でスムーズになります。項目をタップすると✓が付きます。","secs":["必ずお持ちください","あると大変助かります","検査がある日"],"items":[["健康保険証・身分証","受付と保険の確認に必要です。"],["出生時の体重・身長・在胎週数","SGAの診断と保険申請に必須です。母子手帳（予防接種手帳）や出産された病院の記録で確認できます。"],["年ごとの身長・体重の記録","学校の健康診断結果、母子手帳、ご家庭での記録、どれでも構いません。成長カレンダーに先に書き込んでおくこともできます。"],["ご両親それぞれの身長","遺伝的な目標身長の計算に使います。お母さまの初潮の時期と、ご両親の思春期の時期も教えてください。"],["他の病院での検査結果","血液検査や骨年齢X線の結果・CDがあれば、同じ検査を繰り返さずに済みます。"],["服用中の薬・サプリメント","名前と用量を書くか、写真に撮ってお持ちください。漢方薬や健康食品も含めてください。"],["既往歴・手術・入院の記録","診断名と時期を簡単にメモしていただくだけで十分です。"],["思春期の兆候のメモ","乳房のしこり、体毛、体臭などの変化に最初に気づいた時期をメモしていただくと、判断の大きな助けになります。"],["絶食の案内を確認","負荷試験のように絶食が必要な検査があります。予約時にご案内した時間を守ってください。水は飲んでも大丈夫です。"],["お子さまと過ごす準備","検査が長くなることがあります。好きな本やおもちゃ、動きやすい服をお持ちください。"]],"prog":"{done} / {total} 準備できました","note":"<b>出生記録がありませんか？</b>出産された病院に問い合わせるか、母子手帳（予防接種手帳）をご確認ください。一部だけでも大丈夫です。","cost":"<b>初診の費用が気になりますか？</b>検査なしで診察だけなら、負担は大きくありません。血液検査とX線を一緒に行うと、通常約15万～25万ウォン（薬剤を除く）です。検査の内容はお子さまごとに異なり、院長が必要なものだけを決めます。詳しくは[検査のご案内]をご覧ください。"},"test":{"tags":["保険適用","保険適用外（全額負担）","状況によって異なります"],"lbl":["何を確認するか","準備と所要時間","費用と結果"],"note":"<b>検査の費用は3種類に分かれます。</b>保険適用（自己負担30%、6歳未満は21%）、全額自己負担（保険が適用されず、単価をそのまま負担）、自費（病院独自の価格）です。どの検査を行うかは、お子さまに必要なものだけを院長が決めます。","items":[["基本の血液検査","貧血・肝臓・腎臓・甲状腺・血糖","1回の採血で、貧血、肝臓・腎臓の機能、コレステロール、血糖、甲状腺機能、電解質を確認します。成長がゆっくりだったり、体重が気になるときに、隠れた原因を探る基本の検査です。","絶食が必要かどうかは、予約時にご確認ください。採血は1～2分で終わります。","大半が保険適用です。総額約8万4千ウォンのうち、自己負担は約2万5千ウォンです（6歳以上、6歳未満はさらに少なくなります）。結果の多くは当日に確認し、すぐにご説明します。カルシウム・リン・マグネシウムだけは2～3日かかります。"],["成長の指標検査（IGF-1・IGF-BP3）","成長ホルモンの働きを間接的に確認","IGF-1とIGF-BP3は、成長ホルモンが体内でどれだけ働いているかを示します。成長ホルモン欠損症が疑われるときや、治療中に用量を調整するときに確認します。","絶食は不要で、採血は1回です。基本の血液検査と一緒に採血します。","保険が適用されず、全額自己負担です。2項目の合計は約4万7千ウォンです。結果は当日に確認できます。"],["思春期ホルモン検査","思春期が始まったかを見極める","LH・FSH、女児はエストラジオール、男児はテストステロン、DHEAS、プロラクチンを確認します。思春期早発症が疑われるときに、思春期が実際に始まっているかを見極める検査です。","絶食は不要で、採血は1回です。","大半が保険適用です。総額約5万7千～7万ウォンのうち、自己負担は約1万7千～2万1千ウォンです（6歳以上）。検査当日に結果を確認し、すぐにご説明します。"],["栄養状態の検査","ビタミンD・鉄・血糖コントロール・微量元素","ビタミンD、鉄の貯蔵量（フェリチン）、血糖コントロール（HbA1c）、亜鉛や重金属などの微量元素を確認します。成長に必要な栄養状態を調べる、選択的な検査です。","絶食は不要で、採血は1回です。すべてのお子さまに必要な検査ではなく、院長が必要と判断した場合のみ行います。","保険は適用されません。項目別に、ビタミンD 2万ウォン、フェリチン約1万1千ウォン、HbA1c約9千ウォン、重金属・微量元素約3万5千ウォンです。ビタミンD・フェリチン・HbA1cは当日、亜鉛などの重金属・微量元素は2～3日かかります。"],["骨年齢・成長検診X線","左手X線 · 5分","左手のX線1枚で骨年齢を調べます。実年齢に比べて骨がどれだけ成熟しているかから、これからの身長の伸びや思春期の進み方を見極めます。必要に応じて肘も一緒に撮影します。","絶食は不要で、5分で終わります。放射線量は胸部X線の約20分の1と、ごくわずかです。","成長検診X線（手2万ウォン＋肘1万ウォン）は自費です。保険適用の成長ホルモン治療中は保険で請求され、自己負担がかなり少なくなる場合もあります。結果は当日ご説明します。"],["成長ホルモン負荷試験","8時間絶食 · 2～3時間","薬で成長ホルモンの分泌を促したあと、複数回採血して実際にどれだけ分泌されるかを確認します。成長ホルモン欠損症の診断に欠かせない検査です。","前夜0時から8時間の絶食が必要です（水は可）。2～3時間かかるので、午前の予定を空けておいてください。針は1回だけ刺し、そのルートから採血するので、何度も刺すことはありません。","採血の回数が多いため、他の検査より費用が高くなります。正確な費用は予約時にお問い合わせください。結果は当日に確認できます。お子さまの好きな本やおもちゃをお持ちください。"],["GnRH負荷試験","思春期早発症の確認 · 約2時間","注射後、時間ごとに採血して、LH・FSHがどれだけ上がるかを調べます。思春期が実際に始まっているか（中枢性思春期早発症）を確認する検査です。","注射後0～90分の間の決まった時点で採血し、全体で約2時間かかります。絶食の要否は予約時にご確認ください。ルートは1回だけ確保します。","大半が保険適用です。採血の時点数に応じて、自己負担が約2万～4万5千ウォン加わります（6歳以上）。結果は当日に確認してご説明します。"],["脳MRI","20～30分 · 動かないでいる必要あり","視床下部や下垂体など、脳の構造を確認します。思春期がごく早く始まった場合や、ホルモンの異常が疑われる一部のお子さまにだけ必要です。","20～30分かかり、その間は動かないでいる必要があります。7歳未満は軽い鎮静が必要な場合があります。","MRIが必要かどうかは院長が判断します。必要な場合は、費用と予約方法をご案内します。"]]},"faq":{"cats":["予約・来院","検査","治療・注射","費用・保険","書類・その他"],"ph":"キーワードで検索","none":"見つかりませんでした。下のチャットボットかお電話でお問い合わせください。","items":[["診療時間と休診日を教えてください","月・火・水・金は10:00–20:00（昼休み14:00–15:00、受付終了19:45）、土・日は09:00–18:00（昼休み13:00–14:00、受付終了17:45）です。木曜日と祝日は休診です。"],["予約を変更したいです","お電話（02-523-0111）でご連絡ください。やむを得ず来院できない場合は、少なくとも前日までにお知らせいただけると助かります。"],["検査は1日で終わりますか？","初診の相談、骨年齢X線、ほとんどの血液検査は、当日に結果まで確認できます。ただし負荷試験は絶食と2～3時間が必要なため、別途ご予約をお取りします。"],["初診問診票は必ず記入する必要がありますか？","必須ではありませんが、事前に記入していただくと待ち時間が短くなり、記入内容に合わせて、診察前の必見動画のご案内も携帯メールでお送りします。ホーム画面の[初診問診票の事前記入]から記入してください。"],["検査結果はいつ出ますか？","ほとんどの検査は当日に結果を確認し、院長がすぐにご説明します。カルシウム・リン・マグネシウム・亜鉛などの微量元素の検査だけは2～3日かかり、結果が出次第ご案内します。"],["検査の前に絶食が必要ですか？","成長ホルモン負荷試験は、前夜0時から8時間の絶食が必要です（水は可）。ほかの検査は検査ごとに異なるので、予約時のご案内どおりにしてください。"],["子どもが注射・採血を怖がります","成長ホルモンの注射針は0.23mmで、蚊の針より細く、ほとんど痛くありません。負荷試験も針を刺すのは1回だけです。検査の前に何をするかをお子さまに伝えておくと、ずっと落ち着いて受けられます。"],["成長ホルモンは毎日打つのですか？","はい、週6～7回、就寝前に打ちます。体内でホルモンが自然に分泌される時間に合わせるためです。看護師が注射の方法を直接お教えします。"],["一生打ち続けるのですか？","いいえ。成長板が閉じたら終了します。基準は、女児は骨年齢14～15歳、男児は15～16歳です。"],["注射を打ち忘れました","翌日はいつもどおり打ち、2倍量は打たないでください。頻繁に抜けると効果に影響することがあるので、診察時に必ずお伝えください。詳しい基準は院長の指示に従ってください。"],["薬はどのくらいの期間分を処方されますか？","成長ホルモンは通常、4～12週分をまとめて処方します。お子さまごとに異なります。性ホルモン抑制剤には1か月製剤と3か月製剤があります。保管方法は処方時にご案内します。"],["治療中はどのくらいの頻度で通いますか？","通常は1～3か月間隔で診察し、血液検査や骨年齢検査は必要な時期に行います。お子さまの成長速度や治療への反応に応じて、院長が決めます。"],["保険適用・全額自己負担・自費は何が違いますか？","保険適用は、保険の基準に該当して薬代の30%（6歳未満は21%）だけを負担する場合です。基準に該当しないときは、保険の薬価のまま全額負担するか、病院の自費価格が適用されます。同じ薬でも金額の差が大きいので、治療の前に必ずご確認ください。"],["夜間・土曜・祝日は費用が高くなりますか？","診察料に加算が付いて、数千ウォン高くなることがあります。薬代と検査費は同じです。"],["医療費控除は受けられますか？","年間所得の3%を超える医療費は、税額控除の対象になる場合があります。6歳以下は限度がなく、7歳以上は年間700万ウォンまでです。控除の対象かどうかは項目によって異なることがあるので、領収書を保管し、国税庁でご確認ください。"],["診断書や証明書はもらえますか？","一般診断書1万ウォン、英文診断書2万ウォン、意見書（学校提出用）・診療確認書・通院確認書は各3千ウォン、診療記録画像CDは1万ウォンです。金額は変わることがあります。診察時にお申し付けください。"],["通訳は利用できますか？","はい、複数の言語でご案内しています。ご来院前にお知らせいただければ、準備しておきます。"],["お子さまの記録はどう管理しますか？","成長カレンダーに、身長・体重と、注射の日付・部位・用量を記録できます。お子さまは最大4人まで追加でき、きょうだいの予定はカレンダー上に影で表示されます。"]]},"tour":{"insQ0":["治療の種類","まず気になる治療を選んでください。このご案内では成長ホルモンで続けます。思春期早発症の治療は、この段階で選べます。"],"insNext":["続けて費用を確認","[治療費を計算してみる]を押すと、いまの結果に合わせて選択された状態で目安金額を表示します。ご質問はお電話でも承ります。"],"testRes":["準備と費用","何を調べるか、準備と所要時間、費用（保険適用かどうか）と結果が出る時期が表示されます。ほかの検査をタップして比べることもできます。"]}},"vi":{"ins":{"q0":"Bạn muốn tìm hiểu về điều trị nào?","q0h":"Hãy chọn mục gần nhất. Bạn có thể đổi bất cứ lúc nào.","tgh":"Điều trị hormone tăng trưởng","tghs":"Khi bé thấp hơn các bạn cùng tuổi","tpu":"Điều trị dậy thì sớm (thuốc ức chế dậy thì)","tpus":"Khi dậy thì bắt đầu sớm","nextHd":"Bước tiếp theo","gh":{"rTest":["Bé chưa có chẩn đoán nên chúng tôi chưa thể nói được có thuộc diện bảo hiểm hay không. Bảo hiểm được quyết định dựa trên cả \"chẩn đoán\" lẫn \"tiêu chuẩn chiều cao\". Bạn đừng lo lắng. Ở lần khám đầu, chúng tôi sẽ hướng dẫn từng bước các xét nghiệm cần thiết.",["Lần khám đầu thường chụp X-quang tuổi xương (bàn tay trái) và xét nghiệm máu IGF-1.","Nếu cần, sẽ làm tiếp nghiệm pháp kích thích hormone tăng trưởng hoặc xét nghiệm nhiễm sắc thể.","Hãy mang theo ghi chép cân nặng, chiều dài lúc sinh và hồ sơ khám sức khỏe ở trường."]],"rIss":["Thấp lùn vô căn nhìn chung không thuộc diện bảo hiểm chi trả. Nếu điều trị, bạn phải tự trả toàn bộ tiền thuốc và thường kéo dài nhiều năm nên chi phí có thể lớn. Chúng tôi khuyên trước hết hãy cùng bác sĩ bình tĩnh xem xét việc điều trị có thực sự cần thiết không.",["Hãy trao đổi kỹ với bác sĩ về hiệu quả kỳ vọng và chi phí.","Trong phần tính chi phí, hãy xem trước số tiền ước tính ở mục \"Không được bảo hiểm\".","Theo dõi tốc độ tăng trưởng mà chưa điều trị cũng là một lựa chọn."]],"rEarly":["85–90% trẻ sinh nhẹ cân so với tuổi thai (SGA) tự bắt kịp trước 2 tuổi. Bảo hiểm thường áp dụng từ 4 tuổi nên hiện tại việc quan trọng nhất là theo dõi đều đặn.",["Cứ 3 tháng đo chiều cao, cân nặng và ghi vào Lịch tăng trưởng.","Nếu sau 2 tuổi bé vẫn chưa bắt kịp bạn bè, hãy đến khám.","Chuẩn bị trước hồ sơ lúc sinh (tuần thai, cân nặng và chiều dài lúc sinh)."]],"rOk":["Bệnh bạn chọn thuộc diện bảo hiểm và chiều cao nằm ở bách phân vị thứ 3 trở xuống nên có thể đáp ứng tiêu chuẩn chính. Tuy nhiên việc áp dụng thực tế được quyết định sau khi có kết quả xét nghiệm.",["Có thể cần thêm xét nghiệm như nghiệm pháp kích thích hormone tăng trưởng hoặc xét nghiệm nhiễm sắc thể.","Nếu được bảo hiểm, bạn trả 30% tiền thuốc (21% với trẻ dưới 6 tuổi).","Mang theo hồ sơ lúc sinh và hồ sơ tăng trưởng sẽ giúp đánh giá nhanh hơn."]],"rChk":["Bệnh có thể thuộc diện bảo hiểm, nhưng hầu hết tiêu chuẩn còn yêu cầu chiều cao ở bách phân vị thứ 3 trở xuống nên cần kiểm tra.",["Trước hết kiểm tra tình trạng tăng trưởng bằng tuổi xương và xét nghiệm máu.","Nếu chiều cao không đạt tiêu chuẩn, việc áp dụng bảo hiểm có thể khó. Khi đó hãy xem chi phí ở mục \"Không được bảo hiểm\".","Bác sĩ sẽ quyết định cuối cùng sau khi xem kết quả."]]},"p1":["Dấu hiệu dậy thì bắt đầu từ khi nào?","Dấu hiệu đầu tiên là nụ vú ở bé gái và tinh hoàn to lên ở bé trai.",["Bé gái dưới 8 tuổi · bé trai dưới 9 tuổi","Sau độ tuổi đó","Tôi không chắc"]],"p2":["Bé đã làm xét nghiệm dậy thì sớm (nghiệm pháp kích thích GnRH) chưa?","Nếu đã nghe kết quả và được chẩn đoán, hãy chọn mục đầu tiên.",["Đã làm và được chẩn đoán dậy thì sớm","Chưa làm","Tôi không chắc"]],"pub":{"pTest":["Cần xét nghiệm trước","Dậy thì sớm được chẩn đoán dựa trên thời điểm bắt đầu các dấu hiệu cùng với kết quả xét nghiệm. Việc có được bảo hiểm hay không được quyết định sau khi có chẩn đoán.",["Lần khám đầu làm X-quang tuổi xương và xét nghiệm máu hormone.","Nếu cần, dùng nghiệm pháp kích thích GnRH để xác nhận dậy thì đã thật sự bắt đầu (khoảng 2 giờ).","Hãy ghi lại thời điểm dấu hiệu xuất hiện lần đầu và thời điểm bố mẹ dậy thì."]],"pOk":["Có khả năng được bảo hiểm","Nếu dấu hiệu dậy thì bắt đầu sớm và bé đã được chẩn đoán, bé có thể đáp ứng tiêu chuẩn bảo hiểm. Bác sĩ sẽ kiểm tra các tiêu chuẩn chi tiết như chỉ số xét nghiệm và độ tuổi bắt đầu điều trị.",["Nếu được bảo hiểm, mỗi mũi tiêm dạng 1 tháng bạn tự trả khoảng hơn 30.000 won (từ 6 tuổi trở lên).","Nếu không được bảo hiểm, cùng loại thuốc đó phải trả toàn bộ, khoảng 100.000 won mỗi mũi.","Dạng 3 tháng phải trả một lần gấp khoảng 3 lần, hãy kiểm tra trước."]],"pNo":["Có thể khó được bảo hiểm","Dậy thì bắt đầu sau độ tuổi quy định có thể không thuộc tiêu chuẩn dậy thì sớm hoặc không được bảo hiểm chi trả. Cần xem xét riêng xem việc điều trị có thực sự cần thiết không.",["Nếu phải trả toàn bộ tiền thuốc, dạng 1 tháng khoảng 100.000 won mỗi mũi.","Hãy trao đổi trước với bác sĩ về nhu cầu điều trị và chi phí.","Hãy xem khoảng chi phí chính xác trong phần tính chi phí."]]}},"prep":{"lead":"Chuẩn bị trước sẽ giúp buổi khám chính xác và nhanh hơn. Bấm vào mục để đánh dấu ✓.","secs":["Vui lòng mang theo","Có thì rất hữu ích","Vào ngày có xét nghiệm"],"items":[["Thẻ bảo hiểm y tế · giấy tờ tùy thân","Cần cho việc đăng ký và kiểm tra bảo hiểm."],["Cân nặng, chiều dài lúc sinh và tuần thai","Bắt buộc để chẩn đoán SGA và làm hồ sơ bảo hiểm. Có thể tìm trong sổ theo dõi của bé (sổ tiêm chủng) hoặc hồ sơ bệnh viện nơi bé chào đời."],["Ghi chép chiều cao, cân nặng qua các năm","Phiếu khám sức khỏe ở trường, sổ của bé hay số đo tại nhà đều được. Bạn cũng có thể ghi trước vào Lịch tăng trưởng."],["Chiều cao của cả bố và mẹ","Dùng để tính chiều cao mục tiêu theo di truyền. Hãy cho biết cả tuổi có kinh lần đầu của mẹ và thời điểm dậy thì của bố mẹ."],["Kết quả xét nghiệm ở bệnh viện khác","Nếu có kết quả xét nghiệm máu hoặc X-quang tuổi xương (hay đĩa CD), không cần làm lại cùng xét nghiệm."],["Thuốc và thực phẩm bổ sung đang dùng","Ghi tên và liều lượng hoặc chụp ảnh mang theo. Hãy kể cả thuốc đông y và thực phẩm chức năng."],["Bệnh sử, phẫu thuật, nhập viện","Chỉ cần ghi ngắn gọn tên bệnh và thời điểm là đủ."],["Ghi chú dấu hiệu dậy thì","Hãy ghi lại thời điểm bắt đầu thấy nụ vú, lông trên cơ thể, mùi cơ thể... Điều này giúp ích rất nhiều cho việc đánh giá."],["Kiểm tra hướng dẫn nhịn ăn","Một số xét nghiệm như nghiệm pháp kích thích cần nhịn ăn. Hãy tuân thủ giờ đã được hướng dẫn khi đặt lịch. Được uống nước."],["Chuẩn bị để ở cùng bé","Xét nghiệm có thể kéo dài. Hãy mang theo sách hoặc đồ chơi bé thích và quần áo thoải mái."]],"prog":"Đã chuẩn bị {done} / {total}","note":"<b>Không có hồ sơ lúc sinh?</b> Hãy hỏi bệnh viện nơi bé chào đời hoặc xem sổ của bé (sổ tiêm chủng). Chỉ có một phần cũng không sao.","cost":"<b>Bạn thắc mắc về chi phí lần khám đầu?</b> Chỉ khám mà không xét nghiệm thì chi phí không lớn. Nếu làm cả xét nghiệm máu và X-quang, thường khoảng 150.000–250.000 won (chưa gồm thuốc). Bộ xét nghiệm khác nhau với từng bé, bác sĩ chỉ chọn những gì cần thiết. Xem chi tiết ở [Hướng dẫn xét nghiệm]."},"test":{"tags":["Được bảo hiểm","Không được bảo hiểm (tự trả toàn bộ)","Tùy trường hợp"],"lbl":["Kiểm tra điều gì","Chuẩn bị và thời gian","Chi phí và kết quả"],"note":"<b>Chi phí xét nghiệm chia làm ba loại.</b> Được bảo hiểm (tự trả 30%, dưới 6 tuổi là 21%), tự trả toàn bộ (không được bảo hiểm, trả theo đơn giá), và ngoài bảo hiểm (giá riêng của phòng khám). Bác sĩ chỉ chọn những xét nghiệm bé thật sự cần.","items":[["Xét nghiệm máu cơ bản","Thiếu máu · gan · thận · tuyến giáp · đường huyết","Chỉ một lần lấy máu để kiểm tra thiếu máu, chức năng gan và thận, cholesterol, đường huyết, chức năng tuyến giáp và điện giải. Đây là xét nghiệm cơ bản để tìm nguyên nhân tiềm ẩn khi bé lớn chậm hoặc có vấn đề về cân nặng.","Hãy hỏi lúc đặt lịch xem có cần nhịn ăn không. Lấy máu chỉ mất 1–2 phút.","Phần lớn được bảo hiểm. Trong tổng khoảng 84.000 won, bạn tự trả khoảng 25.000 won (từ 6 tuổi, dưới 6 tuổi ít hơn). Hầu hết kết quả có ngay trong ngày và được giải thích luôn. Chỉ canxi, phốt pho và magie mất 2–3 ngày."],["Chỉ số tăng trưởng (IGF-1 · IGF-BP3)","Kiểm tra gián tiếp hoạt động của hormone tăng trưởng","IGF-1 và IGF-BP3 cho thấy hormone tăng trưởng đang hoạt động trong cơ thể ở mức nào. Được kiểm tra khi nghi ngờ thiếu hormone tăng trưởng và khi điều chỉnh liều trong lúc điều trị.","Không cần nhịn ăn, chỉ lấy máu một lần. Lấy cùng lúc với xét nghiệm máu cơ bản.","Không được bảo hiểm nên tự trả toàn bộ. Hai chỉ số cộng lại khoảng 47.000 won. Có kết quả ngay trong ngày."],["Xét nghiệm hormone dậy thì","Đánh giá dậy thì đã bắt đầu chưa","Kiểm tra LH, FSH, cùng estradiol ở bé gái hoặc testosterone ở bé trai, DHEAS và prolactin. Khi nghi ngờ dậy thì sớm, xét nghiệm giúp đánh giá dậy thì có thật sự bắt đầu chưa.","Không cần nhịn ăn, chỉ lấy máu một lần.","Phần lớn được bảo hiểm. Trong tổng khoảng 57.000–70.000 won, bạn tự trả khoảng 17.000–21.000 won (từ 6 tuổi). Có kết quả ngay trong ngày xét nghiệm và được giải thích luôn."],["Xét nghiệm tình trạng dinh dưỡng","Vitamin D · sắt · kiểm soát đường huyết · vi chất","Kiểm tra vitamin D, lượng sắt dự trữ (ferritin), kiểm soát đường huyết (HbA1c) và các vi chất như kẽm, kim loại nặng. Đây là xét nghiệm tùy chọn để xem tình trạng dinh dưỡng cần cho tăng trưởng.","Không cần nhịn ăn, chỉ lấy máu một lần. Không phải bé nào cũng cần, chỉ làm khi bác sĩ thấy cần thiết.","Không được bảo hiểm. Theo từng mục: vitamin D 20.000 won, ferritin khoảng 11.000 won, HbA1c khoảng 9.000 won, kim loại nặng và vi chất khoảng 35.000 won. Vitamin D, ferritin, HbA1c có ngay trong ngày; kim loại nặng và vi chất như kẽm mất 2–3 ngày."],["X-quang tuổi xương · kiểm tra tăng trưởng","X-quang bàn tay trái · 5 phút","Chỉ một tấm X-quang bàn tay trái là xem được tuổi xương. Dựa vào mức xương đã trưởng thành so với tuổi thật để ước đoán chiều cao còn có thể tăng và tiến trình dậy thì. Nếu cần sẽ chụp thêm khuỷu tay.","Không cần nhịn ăn, chỉ mất 5 phút. Liều bức xạ khoảng 1/20 so với X-quang ngực, rất thấp.","X-quang kiểm tra tăng trưởng (bàn tay 20.000 won + khuỷu tay 10.000 won) nằm ngoài bảo hiểm. Khi đang điều trị hormone tăng trưởng được bảo hiểm, có thể được tính theo bảo hiểm và bạn trả ít hơn nhiều. Kết quả được giải thích ngay trong ngày."],["Nghiệm pháp kích thích hormone tăng trưởng","Nhịn ăn 8 giờ · 2–3 giờ","Dùng thuốc kích thích tiết hormone tăng trưởng rồi lấy máu nhiều lần để xem thực tế tiết ra bao nhiêu. Đây là xét nghiệm không thể thiếu để chẩn đoán thiếu hormone tăng trưởng.","Cần nhịn ăn 8 giờ kể từ 12 giờ đêm hôm trước (được uống nước). Mất 2–3 giờ nên hãy dành trống buổi sáng. Kim chỉ đâm một lần và lấy máu qua đường đó, không phải đâm nhiều lần.","Vì lấy máu nhiều lần nên chi phí cao hơn các xét nghiệm khác. Hãy hỏi chi phí chính xác khi đặt lịch. Có kết quả ngay trong ngày. Mang theo sách hoặc đồ chơi bé thích."],["Nghiệm pháp kích thích GnRH","Kiểm tra dậy thì sớm · khoảng 2 giờ","Sau khi tiêm, lấy máu theo từng mốc thời gian để xem LH, FSH tăng bao nhiêu. Dùng để xác nhận dậy thì đã thật sự bắt đầu (dậy thì sớm trung ương).","Lấy máu ở các mốc thời gian quy định trong khoảng 0–90 phút sau tiêm, tổng cộng khoảng 2 giờ. Hãy hỏi lúc đặt lịch về việc nhịn ăn. Đường truyền chỉ đặt một lần.","Phần lớn được bảo hiểm. Tùy số mốc lấy máu, phần bạn tự trả tăng thêm khoảng 20.000–45.000 won (từ 6 tuổi). Kết quả được xác nhận và giải thích ngay trong ngày."],["MRI não","20–30 phút · phải nằm yên","Kiểm tra cấu trúc não như vùng dưới đồi và tuyến yên. Chỉ cần với một số bé dậy thì rất sớm hoặc nghi ngờ bất thường hormone.","Mất 20–30 phút và bé phải nằm yên suốt thời gian đó. Dưới 7 tuổi có thể cần an thần nhẹ.","Bác sĩ sẽ quyết định có cần MRI không. Nếu cần, chúng tôi sẽ hướng dẫn chi phí và cách đặt lịch."]]},"faq":{"cats":["Đặt lịch · khám bệnh","Xét nghiệm","Điều trị · tiêm","Chi phí · bảo hiểm","Giấy tờ · khác"],"ph":"Tìm theo từ khóa","none":"Không tìm thấy. Hãy hỏi chatbot bên dưới hoặc gọi điện cho chúng tôi.","items":[["Giờ khám và ngày nghỉ là khi nào?","T2, T3, T4, T6: 10:00–20:00 (nghỉ trưa 14:00–15:00, nhận số đến 19:45); T7, CN: 09:00–18:00 (nghỉ trưa 13:00–14:00, nhận số đến 17:45). Nghỉ thứ Năm và ngày lễ."],["Tôi muốn đổi lịch hẹn","Vui lòng gọi 02-523-0111. Nếu không thể đến, mong bạn báo trước ít nhất một ngày."],["Có làm xong tất cả xét nghiệm trong một ngày không?","Tư vấn lần đầu, X-quang tuổi xương và hầu hết xét nghiệm máu làm xong và có kết quả ngay trong ngày. Nghiệm pháp kích thích cần nhịn ăn và 2–3 giờ nên chúng tôi đặt lịch riêng."],["Có bắt buộc điền phiếu khám lần đầu không?","Không bắt buộc, nhưng điền trước sẽ rút ngắn thời gian chờ, và chúng tôi sẽ nhắn tin hướng dẫn video cần xem trước khi khám phù hợp với nội dung bạn điền. Hãy điền ở mục [Điền phiếu khám lần đầu] trên màn hình chính."],["Khi nào có kết quả xét nghiệm?","Hầu hết xét nghiệm có kết quả ngay trong ngày và bác sĩ giải thích luôn. Chỉ các xét nghiệm vi chất như canxi, phốt pho, magie, kẽm mất 2–3 ngày, và chúng tôi sẽ thông báo ngay khi có kết quả."],["Có cần nhịn ăn trước khi xét nghiệm không?","Nghiệm pháp kích thích hormone tăng trưởng cần nhịn ăn 8 giờ kể từ 12 giờ đêm hôm trước (được uống nước). Các xét nghiệm khác tùy loại, hãy làm theo hướng dẫn lúc đặt lịch."],["Bé sợ tiêm và lấy máu","Kim tiêm hormone tăng trưởng chỉ 0,23 mm, mảnh hơn cả vòi muỗi nên gần như không đau. Nghiệm pháp kích thích cũng chỉ đâm kim một lần. Nói trước cho bé biết sẽ làm gì sẽ giúp bé yên tâm hơn nhiều."],["Hormone tăng trưởng có phải tiêm mỗi ngày không?","Có, tiêm 6–7 lần mỗi tuần vào buổi tối trước khi ngủ, để phù hợp với thời điểm cơ thể tự tiết hormone. Điều dưỡng sẽ trực tiếp hướng dẫn cách tiêm."],["Có phải tiêm suốt đời không?","Không. Điều trị kết thúc khi sụn tăng trưởng đóng lại. Mốc tham khảo là tuổi xương 14–15 ở bé gái và 15–16 ở bé trai."],["Tôi quên tiêm một mũi","Hôm sau tiêm bình thường, đừng tiêm gấp đôi. Nếu hay bỏ lỡ có thể ảnh hưởng hiệu quả nên hãy báo cho chúng tôi khi đến khám. Tiêu chuẩn chi tiết hãy theo hướng dẫn của bác sĩ."],["Mỗi lần kê thuốc dùng trong bao lâu?","Hormone tăng trưởng thường được kê 4–12 tuần mỗi lần, tùy từng bé. Thuốc ức chế dậy thì có dạng 1 tháng và 3 tháng. Cách bảo quản sẽ được hướng dẫn khi kê thuốc."],["Trong lúc điều trị bao lâu phải đến khám một lần?","Thường 1–3 tháng một lần, xét nghiệm máu và tuổi xương làm vào thời điểm cần thiết. Bác sĩ sẽ quyết định dựa trên tốc độ tăng trưởng và đáp ứng điều trị của bé."],["Được bảo hiểm, tự trả toàn bộ và ngoài bảo hiểm khác nhau thế nào?","Được bảo hiểm nghĩa là đáp ứng tiêu chuẩn và chỉ trả 30% tiền thuốc (21% với trẻ dưới 6 tuổi). Nếu không đáp ứng, bạn trả toàn bộ theo giá thuốc bảo hiểm hoặc áp dụng giá ngoài bảo hiểm của phòng khám. Cùng một loại thuốc nhưng số tiền chênh lệch rất lớn, nên hãy kiểm tra trước khi điều trị."],["Ban đêm, thứ Bảy và ngày lễ có đắt hơn không?","Phí khám được cộng thêm phụ phí, có thể cao hơn vài nghìn won. Tiền thuốc và xét nghiệm không đổi."],["Có được khấu trừ chi phí y tế không?","Chi phí y tế vượt quá 3% thu nhập năm có thể được khấu trừ thuế. Trẻ từ 6 tuổi trở xuống không giới hạn, từ 7 tuổi trở lên tối đa 7 triệu won mỗi năm. Khả năng khấu trừ có thể khác nhau theo từng khoản, hãy giữ hóa đơn và xác nhận với Cục Thuế Quốc gia."],["Tôi có thể xin giấy chẩn đoán, giấy xác nhận không?","Giấy chẩn đoán thông thường 10.000 won, giấy chẩn đoán tiếng Anh 20.000 won, giấy ý kiến (nộp trường), giấy xác nhận khám và giấy xác nhận ngoại trú mỗi loại 3.000 won, đĩa CD hồ sơ bệnh án 10.000 won. Giá có thể thay đổi. Hãy báo khi đến khám."],["Có phiên dịch không?","Có, chúng tôi hướng dẫn bằng nhiều ngôn ngữ. Hãy báo trước khi đến để chúng tôi chuẩn bị."],["Làm sao quản lý hồ sơ của bé?","Trong Lịch tăng trưởng, bạn ghi được chiều cao, cân nặng, ngày tiêm, vị trí và liều lượng. Có thể thêm tối đa 4 bé, lịch của anh chị em được tô bóng trên lịch."]]},"tour":{"insQ0":["Loại điều trị","Trước tiên hãy chọn điều trị bạn muốn tìm hiểu. Hướng dẫn này tiếp tục với hormone tăng trưởng. Điều trị dậy thì sớm có thể chọn ở bước này."],"insNext":["Tiếp theo: xem chi phí","Bấm [Xem thử chi phí điều trị], số tiền ước tính sẽ hiện ra với lựa chọn đã chọn sẵn theo kết quả vừa rồi. Bạn cũng có thể gọi điện để hỏi."],"testRes":["Chuẩn bị và chi phí","Hiển thị xét nghiệm kiểm tra gì, chuẩn bị và thời gian, chi phí (có được bảo hiểm không) và thời điểm có kết quả. Bạn có thể bấm xét nghiệm khác để so sánh."]}},"th":{"ins":{"q0":"สนใจการรักษาแบบไหน?","q0h":"เลือกข้อที่ใกล้เคียงที่สุด เปลี่ยนได้ทุกเมื่อ","tgh":"การรักษาด้วยฮอร์โมนการเจริญเติบโต","tghs":"เมื่อลูกเตี้ยกว่าเด็กวัยเดียวกัน","tpu":"การรักษาภาวะเข้าสู่วัยเจริญพันธุ์เร็ว (ยาชะลอวัยเจริญพันธุ์)","tpus":"เมื่อวัยเจริญพันธุ์เริ่มเร็ว","nextHd":"ขั้นตอนต่อไป","gh":{"rTest":["ยังไม่มีการวินิจฉัย จึงยังบอกไม่ได้ว่าใช้สิทธิประกันได้หรือไม่ สิทธิประกันต้องดูทั้ง \"การวินิจฉัย\" และ \"เกณฑ์ส่วนสูง\" ไปด้วยกัน ไม่ต้องกังวลนะคะ ในการมาครั้งแรกเราจะแนะนำการตรวจที่จำเป็นให้ทีละขั้น",["ครั้งแรกมักตรวจอายุกระดูก (เอกซเรย์มือซ้าย) และตรวจเลือด IGF-1","หากจำเป็นจะตรวจกระตุ้นฮอร์โมนการเจริญเติบโตหรือตรวจโครโมโซมต่อ","นำบันทึกน้ำหนักและความยาวแรกเกิด และผลตรวจสุขภาพที่โรงเรียนมาด้วย"]],"rIss":["ภาวะเตี้ยไม่ทราบสาเหตุโดยทั่วไปไม่อยู่ในสิทธิประกัน หากเริ่มรักษาจะต้องจ่ายค่ายาเต็มจำนวน และมักต่อเนื่องหลายปี ภาระค่าใช้จ่ายจึงอาจสูง แนะนำให้ค่อย ๆ พิจารณาร่วมกับแพทย์ก่อนว่าจำเป็นต้องรักษาจริงหรือไม่",["ปรึกษาแพทย์ให้ละเอียดเรื่องผลที่คาดหวังและค่าใช้จ่าย","ในหน้าคำนวณค่ารักษา ลองดูประมาณการแบบ \"ใช้สิทธิไม่ได้\" ล่วงหน้า","การเฝ้าดูอัตราการเจริญเติบโตโดยยังไม่รักษาก็เป็นอีกทางเลือก"]],"rEarly":["เด็กที่เกิดตัวเล็กกว่าอายุครรภ์ (SGA) 85–90% จะตามทันเองก่อนอายุ 2 ปี สิทธิประกันโดยทั่วไปเริ่มที่อายุ 4 ปี ตอนนี้จึงเป็นช่วงติดตามดูอย่างสม่ำเสมอ",["วัดส่วนสูงและน้ำหนักทุก 3 เดือน แล้วบันทึกในปฏิทินการเจริญเติบโต","หากเกิน 2 ปีแล้วยังตามเพื่อนไม่ทัน ให้มาพบแพทย์","เตรียมบันทึกแรกเกิด (อายุครรภ์ น้ำหนัก และความยาวแรกเกิด) ไว้ล่วงหน้า"]],"rOk":["โรคที่เลือกอยู่ในสิทธิประกัน และส่วนสูงต่ำกว่าเปอร์เซ็นไทล์ที่ 3 จึงมีโอกาสเข้าเกณฑ์หลัก แต่การใช้สิทธิจริงจะตัดสินหลังดูผลตรวจ",["อาจต้องตรวจเพิ่ม เช่น ตรวจกระตุ้นฮอร์โมนการเจริญเติบโตหรือตรวจโครโมโซม","หากใช้สิทธิได้ จ่าย 30% ของค่ายา (21% สำหรับเด็กอายุต่ำกว่า 6 ปี)","นำบันทึกแรกเกิดและบันทึกการเจริญเติบโตมาด้วยจะช่วยให้ประเมินได้เร็วขึ้น"]],"rChk":["โรคนี้อาจอยู่ในสิทธิประกัน แต่เกณฑ์ส่วนใหญ่ต้องการส่วนสูงต่ำกว่าเปอร์เซ็นไทล์ที่ 3 ด้วย จึงต้องตรวจสอบ",["ตรวจอายุกระดูกและตรวจเลือดเพื่อดูสภาพการเจริญเติบโตก่อน","หากส่วนสูงไม่เข้าเกณฑ์ อาจใช้สิทธิได้ยาก ในกรณีนั้นให้ดูค่าใช้จ่ายแบบ \"ใช้สิทธิไม่ได้\"","แพทย์จะตัดสินขั้นสุดท้ายหลังดูผลตรวจ"]]},"p1":["สัญญาณวัยเจริญพันธุ์เริ่มเมื่อไหร่?","สัญญาณแรกคือก้อนที่หน้าอกในเด็กหญิง และอัณฑะโตขึ้นในเด็กชาย",["เด็กหญิงก่อน 8 ปี · เด็กชายก่อน 9 ปี","เริ่มหลังจากนั้น","ไม่แน่ใจ"]],"p2":["เคยตรวจภาวะเข้าสู่วัยเจริญพันธุ์เร็ว (ตรวจกระตุ้น GnRH) หรือยัง?","หากฟังผลและได้รับการวินิจฉัยแล้ว ให้เลือกข้อแรก",["เคยตรวจ และได้รับการวินิจฉัยว่าเข้าสู่วัยเจริญพันธุ์เร็ว","ยังไม่เคยตรวจ","ไม่แน่ใจ"]],"pub":{"pTest":["ต้องตรวจก่อน","ภาวะเข้าสู่วัยเจริญพันธุ์เร็ววินิจฉัยจากช่วงเวลาที่สัญญาณเริ่มปรากฏร่วมกับผลตรวจ ส่วนสิทธิประกันจะตัดสินหลังมีการวินิจฉัย",["ครั้งแรกตรวจอายุกระดูกด้วยเอกซเรย์และตรวจเลือดดูฮอร์โมน","หากจำเป็นใช้การตรวจกระตุ้น GnRH เพื่อยืนยันว่าวัยเจริญพันธุ์เริ่มจริง (ประมาณ 2 ชั่วโมง)","จดช่วงที่เห็นสัญญาณครั้งแรก และช่วงที่พ่อแม่เข้าสู่วัยเจริญพันธุ์"]],"pOk":["มีโอกาสใช้สิทธิประกันได้","หากสัญญาณเริ่มตั้งแต่อายุน้อยและได้รับการวินิจฉัยแล้ว อาจเข้าเกณฑ์สิทธิประกัน รายละเอียด เช่น ค่าผลตรวจและอายุที่เริ่มรักษา แพทย์จะตรวจสอบ",["หากใช้สิทธิได้ ยาฉีดแบบ 1 เดือนแต่ละครั้งจ่ายเองประมาณ 30,000 วอนต้น ๆ (อายุ 6 ปีขึ้นไป)","หากใช้สิทธิไม่ได้ ยาตัวเดียวกันต้องจ่ายเต็ม ประมาณ 100,000 วอนต่อครั้ง","แบบ 3 เดือนจ่ายครั้งเดียวสูงเป็น 3 เท่า ควรตรวจสอบล่วงหน้า"]],"pNo":["อาจใช้สิทธิประกันได้ยาก","วัยเจริญพันธุ์ที่เริ่มหลังอายุตามเกณฑ์ อาจไม่เข้าเกณฑ์ภาวะเข้าสู่วัยเจริญพันธุ์เร็วหรือไม่ได้รับสิทธิประกัน ต้องพิจารณาแยกต่างหากว่าจำเป็นต้องรักษาจริงหรือไม่",["หากจ่ายค่ายาเต็มจำนวน แบบ 1 เดือนประมาณ 100
