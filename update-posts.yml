# 선택 사항: GitHub에서 하루 한 번 블로그 최신 글을 자동으로 posts.json 에 저장합니다.
# 저장소의 .github/workflows/update-posts.yml 위치에 두세요. (update-posts.py 도 저장소 맨 위에 있어야 해요)
name: update-posts
on:
  schedule: [{cron: '0 21 * * *'}]   # 매일 오전 6시(한국시간)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python update-posts.py ha5857
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add posts.json
          git diff --cached --quiet || (git commit -m "update blog posts" && git push)
